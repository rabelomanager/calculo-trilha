<script type="text/plain" id="app-src">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================ UTIL ============================ */
const DAY = 86400000;
const todayKey = (offset=0) => { const d = new Date(Date.now() + offset*DAY); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const fmtDate = (ts) => new Date(ts).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const hasTex = (s)=> typeof s==='string' && /\\|\^|_|\{|\\frac|\\lim|\\int|\\sqrt/.test(s);
// aleatórios (para geradores)
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{ let x=0; while(x===0) x=ri(a,b); return x; };
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const sgn=(n)=> (n>=0?`+ ${n}`:`- ${-n}`);
const shuffle=(arr)=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function M({ tex, block }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.katex) { try { window.katex.render(tex, ref.current, { throwOnError:false, displayMode: !!block }); } catch(e){ ref.current.textContent = tex; } }
    else if (ref.current) { ref.current.textContent = tex; }
  }, [tex, block]);
  return block ? <div className="my-2 overflow-x-auto text-center" ref={ref}>{tex}</div> : <span ref={ref}>{tex}</span>;
}
// Rich: renderiza texto+matemática misturados (prosa como texto, fórmulas via KaTeX).
// Conserta o problema de a questão inteira virar "modo matemático" (que junta as palavras).
function classTok(t){
  // TEXTO só se for palavra pura (letras/acentos, com hífen/apóstrofo internos e pontuação no fim).
  // Qualquer token com dígito, chave, barra invertida ou símbolo matemático é FÓRMULA — assim
  // termos como "5x", "6}{x", "\\frac{..." não são separados e o LaTeX não quebra no meio.
  return /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’\-]*[.,;:!?)"'”’…]*$/.test(t) ? 't' : 'm';
}
function Rich({s, block}){
  const parts = useMemo(()=>{
    // Tokeniza preservando os espaços. Mantém 'depth' de chaves e 'carry' (macro que
    // espera argumento, ex.: \vec, \sqrt, \text sem {) para NÃO partir a fórmula no meio.
    const toks = String(s==null?'':s).split(/(\s+)/);
    const out=[]; let depth=0, carry=false;
    for(const w of toks){
      if(w==='') continue;
      if(/^\s+$/.test(w)){ if(out.length) out[out.length-1].v+=w; else out.push({c:'t',v:w}); continue; }
      const cls = (depth>0 || carry) ? 'm' : classTok(w);
      const opens=(w.match(/\{/g)||[]).length, closes=(w.match(/\}/g)||[]).length;
      depth = Math.max(0, depth+opens-closes);
      carry = cls==='m' && depth===0 && /\\[a-zA-Z]+$/.test(w);
      const last=out[out.length-1];
      if(last && last.c===cls) last.v+=w; else out.push({c:cls,v:w});
    }
    return out;
  },[s]);
  const El = block ? 'div' : 'span';
  return <El className={block?'leading-relaxed':undefined}>{parts.map((p,i)=><React.Fragment key={i}>{p.c==='m'?<M tex={p.v}/>:<span>{p.v}</span>}</React.Fragment>)}</El>;
}
function T({s}){ return <Rich s={s}/>; }

const DIFF = {
  1:{n:'Fácil', emo:'🟢', cls:'text-green-700 bg-green-50 border-green-200'},
  2:{n:'Médio', emo:'🟡', cls:'text-amber-700 bg-amber-50 border-amber-200'},
  3:{n:'Difícil', emo:'🔴', cls:'text-red-700 bg-red-50 border-red-200'},

/* ============================ CONTEÚDO ============================
   Blocos de teoria: p, f(fórmula), met(metodologia), tip, err(erro comum), why(por que importa)
   Exercícios (pool graduado por d:1|2|3): tipos mc, num, tf, err(ache o passo errado), order(ordene)
   gen: geradores parametrizados -> prática infinita
   cards: flashcards [frente, verso]
================================================================== */
const P=(t)=>({t:'p',c:t}); const F=(t)=>({t:'f',c:t}); const TIP=(t)=>({t:'tip',c:t});
const MET=(t)=>({t:'met',c:t}); const ERR=(t)=>({t:'err',c:t}); const WHY=(t)=>({t:'why',c:t});
const mc=(d,q,options,a,hint,sol)=>({d,type:'mc',q,options,a,hint,sol,tex:true});
const nu=(d,q,a,tol,hint,sol)=>({d,type:'num',q,a,tol:tol||0.001,hint,sol});
const mcS=(d,q,options,a,hint,sol,src)=>({d,type:'mc',q,options,a,hint,sol,tex:true,src});
const nuS=(d,q,a,tol,hint,sol,src)=>({d,type:'num',q,a,tol:tol||0.001,hint,sol,src});
const tf=(d,q,a,hint,sol)=>({d,type:'tf',q,a,hint,sol});                    // a: true/false
const er=(d,q,steps,bad,hint,sol)=>({d,type:'err',q,steps,a:bad,hint,sol}); // bad: índice do passo errado
const od=(d,q,steps,hint)=>({d,type:'order',q,steps,hint});                 // steps na ordem correta

/* ---- geradores parametrizados (prática infinita) ---- */
function genFrac(){ const b=pick([2,3,4,5]), d2=pick([2,3,4,6]); const a=ri(1,b-1), c=ri(1,d2-1); const val=a/b+c/d2;
  return {d:2,type:'num',q:`Calcule \\frac{${a}}{${b}}+\\frac{${c}}{${d2}}. (decimal, 2 casas)`,a:Math.round(val*100)/100,tol:0.02,hint:'Denominador comum e some os numeradores.',sol:`= ${val.toFixed(3)}`,gen:true}; }
function genPot(){ const base=pick([2,3,5]), m=ri(2,4), n=ri(1,2); const val=Math.pow(base,m+n);
  return {d:2,type:'num',q:`Calcule ${base}^{${m}}\\cdot ${base}^{${n}}.`,a:val,tol:0.5,hint:'Mesma base: some os expoentes.',sol:`${base}^{${m+n}} = ${val}.`,gen:true}; }
function genEq1(){ const a=rnz(2,6), x=ri(-6,6), b=ri(-9,9); const c=a*x+b;
  return {d:2,type:'num',q:`Resolva ${a}x ${sgn(b)} = ${c}. x = ?`,a:x,tol:0.001,hint:'Isole x: passe o termo livre e divida.',sol:`${a}x = ${c-b} ⇒ x = ${x}.`,gen:true}; }
function genAfim(){ const a=rnz(-4,4), b=ri(-6,6), k=ri(-4,4); const val=a*k+b;
  return {d:2,type:'num',q:`Sendo f(x)=${a}x ${sgn(b)}, calcule f(${k}).`,a:val,tol:0.001,hint:'Substitua x pelo valor.',sol:`${a}·(${k}) ${sgn(b)} = ${val}.`,gen:true}; }
function genQuad(){ let r1=rnz(-5,5), r2=rnz(-5,5); const b=-(r1+r2), c=r1*r2; const mode=pick(['soma','produto']); const a= mode==='soma'? r1+r2 : r1*r2;
  return {d:3,type:'num',q:`Em x^2 ${sgn(b)}x ${sgn(c)}=0, qual a ${mode} das raízes?`,a,tol:0.001,hint:mode==='soma'?'Soma das raízes = -b.':'Produto das raízes = c.',sol:`Raízes ${r1} e ${r2}: ${mode} = ${a}.`,gen:true}; }
function genLim(){ let r=ri(-4,4), s=ri(-4,4); while(s===r) s=ri(-4,4); const b=-(r+s), c=r*s; const a=r-s;
  return {d:2,type:'num',q:`Calcule \\lim_{x\\to ${r}}\\frac{x^2 ${sgn(b)}x ${sgn(c)}}{x ${sgn(-r)}}.`,a,tol:0.001,hint:`Fatore o numerador e cancele (x ${sgn(-r)}).`,sol:`(x ${sgn(-r)})(x ${sgn(-s)}) / (x ${sgn(-r)}) → x ${sgn(-s)} → ${a}.`,gen:true}; }
function genDer(){ const a=rnz(1,4), n=ri(2,4), k=ri(1,4); const coef=a*n; const val=coef*Math.pow(k,n-1);
  return {d:2,type:'num',q:`Sendo f(x)=${a}x^{${n}}, calcule f'(${k}).`,a:val,tol:0.001,hint:`Regra da potência: f'(x)=${a}·${n}x^{${n-1}}.`,sol:`f'(x)=${coef}x^{${n-1}} ⇒ f'(${k})=${val}.`,gen:true}; }
function genInt(){ const a=rnz(1,4), n=ri(1,3), p=ri(0,2), q=p+ri(1,2); const F=(t)=>a*Math.pow(t,n+1)/(n+1); const val=F(q)-F(p);
  return {d:3,type:'num',q:`Calcule \\int_{${p}}^{${q}} ${a}x^{${n}}\\,dx. (decimal, 2 casas)`,a:Math.round(val*100)/100,tol:0.05,hint:`Antiderivada: \\frac{${a}x^{${n+1}}}{${n+1}}.`,sol:`F(x)=${a}x^{${n+1}}/${n+1}; F(${q})-F(${p}) ≈ ${val.toFixed(2)}.`,gen:true}; }

/* ---- geradores de física (curso aeroespacial) ---- */
function genQheat(){ const m=ri(2,6), c=pick([2,4,5,10]), dT=ri(3,12); return {d:2,type:'num',q:`Um corpo de ${m} kg e calor específico ${c} J/(kg·K) varia ${dT} K de temperatura. Qual o calor Q (J)?`,a:m*c*dT,tol:0.5,hint:'Q = m·c·ΔT.',sol:`${m}·${c}·${dT} = ${m*c*dT} J.`,gen:true}; }
function genCont(){ const A1=ri(4,10), v1=ri(2,8), A2=ri(2,A1-1); const v2=A1*v1/A2; return {d:2,type:'num',q:`Num duto, a área passa de ${A1} para ${A2} cm² e a velocidade inicial é ${v1} m/s. Velocidade final (m/s, 2 casas)?`,a:Math.round(v2*100)/100,tol:0.05,hint:'A₁v₁ = A₂v₂ ⇒ v₂ = A₁v₁/A₂.',sol:`(${A1}·${v1})/${A2} ≈ ${v2.toFixed(2)} m/s.`,gen:true}; }
function genWave(){ const lam=ri(1,6), f=ri(2,12); return {d:1,type:'num',q:`Uma onda tem comprimento ${lam} m e frequência ${f} Hz. Velocidade (m/s)?`,a:lam*f,tol:0.5,hint:'v = λ·f.',sol:`${lam}·${f} = ${lam*f} m/s.`,gen:true}; }
function genBuoy(){ const V=pick([0.1,0.2,0.5,1,2]); const E=1000*V*10; return {d:2,type:'num',q:`Objeto de volume ${V} m³ totalmente submerso na água (ρ=1000 kg/m³, g=10). Empuxo (N)?`,a:E,tol:0.5,hint:'E = ρ·V·g.',sol:`1000·${V}·10 = ${E} N.`,gen:true}; }
function genPress(){ const h=ri(2,20); const p=1000*10*h; return {d:2,type:'num',q:`Pressão manométrica da água a ${h} m de profundidade (ρ=1000, g=10)? (Pa)`,a:p,tol:0.5,hint:'p = ρ·g·h.',sol:`1000·10·${h} = ${p} Pa.`,gen:true}; }
function genGasLaw(){ const p1=ri(2,6), V1=ri(2,8), p2=ri(2,6); const V2=p1*V1/p2; return {d:3,type:'num',q:`Um gás a ${p1} atm ocupa ${V1} L. A T constante, a pressão vira ${p2} atm. Novo volume (L, 2 casas)?`,a:Math.round(V2*100)/100,tol:0.05,hint:'p₁V₁ = p₂V₂ (T constante).',sol:`(${p1}·${V1})/${p2} ≈ ${V2.toFixed(2)} L.`,gen:true}; }
function genCarnot(){ const Tc=ri(2,4)*100; const Th=Tc+ri(1,4)*100; const eff=1-Tc/Th; return {d:3,type:'num',q:`Máquina de Carnot entre ${Tc} K (fria) e ${Th} K (quente). Eficiência máxima (decimal, 2 casas)?`,a:Math.round(eff*100)/100,tol:0.02,hint:'η = 1 − Tc/Th (em Kelvin).',sol:`1 − ${Tc}/${Th} ≈ ${eff.toFixed(2)}.`,gen:true}; }
function genSpring(){ const m=ri(1,4), k=pick([1,4,9,16,25]); const Tt=2*Math.PI*Math.sqrt(m/k); return {d:2,type:'num',q:`Massa-mola: m=${m} kg, k=${k} N/m. Período T (s, 2 casas)?`,a:Math.round(Tt*100)/100,tol:0.05,hint:'T = 2π√(m/k).',sol:`2π√(${m}/${k}) ≈ ${Tt.toFixed(2)} s.`,gen:true}; }
function genPend(){ const L=pick([0.1,0.4,0.9,1.6,2.5]); const Tt=2*Math.PI*Math.sqrt(L/10); return {d:2,type:'num',q:`Pêndulo simples L=${L} m (g=10). Período T (s, 2 casas)?`,a:Math.round(Tt*100)/100,tol:0.05,hint:'T = 2π√(L/g).',sol:`2π√(${L}/10) ≈ ${Tt.toFixed(2)} s.`,gen:true}; }
function genGravF(){ const m1=ri(2,9), m2=ri(2,9), r=ri(2,6); const v=m1*m2/(r*r); return {d:2,type:'num',q:`Duas massas de ${m1} kg e ${m2} kg a ${r} m de distância. Quanto vale F/G (= m₁m₂/r², 3 casas)?`,a:Math.round(v*1000)/1000,tol:0.01,hint:'F = G·m₁m₂/r²; aqui pede m₁m₂/r².',sol:`${m1}·${m2}/${r}² ≈ ${v.toFixed(3)}.`,gen:true}; }

/* ---- geradores de mecânica (curso de Física) ---- */
function genFma(){ const m=ri(2,10), a=ri(1,9); return {d:2,type:'num',q:`Um corpo de ${m} kg sofre aceleração de ${a} m/s². Qual a força resultante (N)?`,a:m*a,tol:0.5,hint:'F = m·a (2ª lei de Newton).',sol:`${m}·${a} = ${m*a} N.`,gen:true}; }
function genVfinal(){ const v0=ri(0,10), a=ri(1,6), t=ri(1,8); return {d:2,type:'num',q:`Um móvel parte de v₀=${v0} m/s com aceleração ${a} m/s². Velocidade após ${t} s? (m/s)`,a:v0+a*t,tol:0.5,hint:'v = v₀ + a·t.',sol:`${v0}+${a}·${t} = ${v0+a*t} m/s.`,gen:true}; }
function genKE(){ const m=pick([2,4,6,8,10]), v=ri(2,8); return {d:2,type:'num',q:`Energia cinética de ${m} kg a ${v} m/s? (J)`,a:0.5*m*v*v,tol:0.5,hint:'E_c = ½mv².',sol:`0,5·${m}·${v}² = ${0.5*m*v*v} J.`,gen:true}; }
function genWork(){ const F=ri(2,12), d=ri(2,10); return {d:1,type:'num',q:`Trabalho de uma força de ${F} N que desloca um corpo ${d} m na mesma direção? (J)`,a:F*d,tol:0.5,hint:'W = F·d (mesma direção).',sol:`${F}·${d} = ${F*d} J.`,gen:true}; }
function genMomentum(){ const m=ri(2,10), v=ri(2,9); return {d:1,type:'num',q:`Momento linear de ${m} kg a ${v} m/s? (kg·m/s)`,a:m*v,tol:0.5,hint:'p = m·v.',sol:`${m}·${v} = ${m*v}.`,gen:true}; }
function genImpulse(){ const F=ri(2,10), t=ri(1,6); return {d:2,type:'num',q:`Impulso de uma força de ${F} N aplicada por ${t} s? (N·s)`,a:F*t,tol:0.5,hint:'J = F·Δt = Δp.',sol:`${F}·${t} = ${F*t}.`,gen:true}; }
function genCentrip(){ const v=ri(2,10), r=pick([1,2,4,5]); return {d:2,type:'num',q:`Aceleração centrípeta a ${v} m/s num raio de ${r} m? (m/s², 2 casas)`,a:Math.round(v*v/r*100)/100,tol:0.05,hint:'a_c = v²/r.',sol:`${v}²/${r} ≈ ${(v*v/r).toFixed(2)}.`,gen:true}; }
function genFriction(){ const mu=pick([0.2,0.3,0.4,0.5]), m=ri(2,10); return {d:2,type:'num',q:`Atrito sobre ${m} kg num piso horizontal com μ=${mu} (g=10)? (N)`,a:Math.round(mu*m*10*100)/100,tol:0.05,hint:'f = μ·N, com N=mg.',sol:`${mu}·${m}·10 = ${mu*m*10} N.`,gen:true}; }
function genPE(){ const m=ri(2,10), h=ri(2,10); return {d:1,type:'num',q:`Energia potencial gravitacional de ${m} kg a ${h} m de altura (g=10)? (J)`,a:m*10*h,tol:0.5,hint:'U = m·g·h.',sol:`${m}·10·${h} = ${m*10*h} J.`,gen:true}; }
function genTorque(){ const r=ri(1,5), F=ri(2,10); return {d:2,type:'num',q:`Torque de uma força de ${F} N aplicada perpendicularmente a ${r} m do eixo? (N·m)`,a:r*F,tol:0.5,hint:'τ = r·F (força perpendicular).',sol:`${r}·${F} = ${r*F} N·m.`,gen:true}; }
function genRotV(){ const w=ri(2,8), r=pick([0.5,1,2,3]); return {d:2,type:'num',q:`Um ponto a ${r} m do eixo gira com ω=${w} rad/s. Velocidade linear? (m/s, 2 casas)`,a:Math.round(w*r*100)/100,tol:0.05,hint:'v = ω·r.',sol:`${w}·${r} = ${(w*r).toFixed(2)} m/s.`,gen:true}; }

  { id:'calc', title:'Cálculo', short:'Cálculo', icon:'📐', desc:'Do fim do fundamental ao Cálculo I', goal:'Meta: dominar Limite, Derivada e Integral 🎯', skills:CURR },
  { id:'fisica', title:'Física Básica', short:'Física', icon:'🧲', desc:'Mecânica clássica — de vetores à rotação', goal:'Meta: cinemática, Newton, energia, momento e rotação 🧲', skills:FISICA },
  { id:'aero', title:'Ciências Aeroespaciais', short:'Aeroespacial', icon:'🚀', desc:'Física para tecnologia aeroespacial', goal:'Meta: gravitação, fluidos, calor e ondas 🚀', skills:AERO },
];
COURSES.forEach(c=>{ c.modules=[...new Set(c.skills.map(s=>s.mod))]; });
const findCourse=(id)=>COURSES.find(c=>c.id===id);

/* seleção de questão */
function pickIdx(pool, d, used){ const avail=pool.map((q,i)=>i).filter(i=>used.indexOf(i)<0); if(!avail.length) return null; avail.sort((a,b)=>Math.abs(pool[a].d-d)-Math.abs(pool[b].d-d)); return avail[0]; }
function pickDiagItem(skill, d){ const same=skill.pool.filter(q=>q.d===d); const mcq=same.find(q=>q.type==='mc'||q.type==='tf'); return mcq || skill.pool[pickIdx(skill.pool,d,[])]; }
// próxima questão para prática/aula: usa gerador quando o pool não basta
function nextExercise(skill, used, diff, preferGen){
  if(preferGen && skill.gen && skill.gen.length && Math.random()<0.65) return pick(skill.gen)();
  const idx=pickIdx(skill.pool, diff, used);
  if(idx==null){ if(skill.gen && skill.gen.length) return pick(skill.gen)(); return {__idx:pickIdx(skill.pool,diff,[]), recycle:true}; }
  return {__idx:idx};
}

/* ============================ ESTADO ============================ */
const STORE_KEY = 'trilha_estudos_v4';
const emptyCourse = () => ({ diagnosticDone:false, skills:{}, reviews:[] });
const defaultState = () => ({ user:{ name:'', xp:0, streak:0, lastActive:0, simDays:0 }, currentCourse:null, courses:{}, log:[] });
function loadState(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultState(); } catch(e){ return defaultState(); } }
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

const LEVELS = [ {min:0,name:'Iniciante',emoji:'🌱'},{min:80,name:'Aprendiz',emoji:'📗'},{min:200,name:'Explorador',emoji:'🧭'},{min:400,name:'Calculista',emoji:'📐'},{min:700,name:'Analista',emoji:'🧠'},{min:1100,name:'Mestre',emoji:'🏆'} ];
const levelOf = (xp)=>{ let L=LEVELS[0]; for(const l of LEVELS) if(xp>=l.min) L=l; return L; };
const nextLevel = (xp)=> LEVELS.find(l=>l.min>xp) || null;
const REVIEW_STAGES = [0, 7, 30];

function useApp(){
  const [state, setState] = useState(loadState);
  useEffect(()=>saveState(state), [state]);
  const now = ()=> todayKey(state.user.simDays);
  const bumpStreak = (s)=>{ const t=todayKey(s.user.simDays); const last=s.user.lastActive; if(last===t) return s.user.streak; if(last===t-DAY) return s.user.streak+1; return 1; };
  const course = state.currentCourse ? findCourse(state.currentCourse) : null;
  const cp = state.currentCourse ? (state.courses[state.currentCourse] || emptyCourse()) : emptyCourse();

  const freshDaily=(t)=>({date:t, q:0, lessons:0, xp:0, claimed:[]});
  const dayOf=(u,t)=> (u.daily && u.daily.date===t) ? u.daily : freshDaily(t);
  const daily = dayOf(state.user, todayKey(state.user.simDays));

  const addXp = useCallback((amount, note, isBonus)=>{ setState(s=>{ const streak=bumpStreak(s); const t=todayKey(s.user.simDays); const d=dayOf(s.user,t); const nd={...d, xp:d.xp+amount, q:d.q+(isBonus?0:1)}; return {...s, user:{...s.user, xp:s.user.xp+amount, streak, lastActive:t, daily:nd}, log:[{ts:Date.now(),note,xp:amount},...(s.log||[])].slice(0,50)}; }); },[]);
  const claimMission = useCallback((id, bonus)=>{ setState(s=>{ const t=todayKey(s.user.simDays); const d=dayOf(s.user,t); if(d.claimed.includes(id)) return s; return {...s, user:{...s.user, xp:s.user.xp+bonus, lastActive:t, streak:bumpStreak(s), daily:{...d, xp:d.xp+bonus, claimed:[...d.claimed,id]}}}; }); },[]);

  const masterSkill = useCallback((skillId, score, lvl)=>{ setState(s=>{ const cid=s.currentCourse; const def=findCourse(cid); const cur=s.courses[cid]||emptyCourse(); const skills={...cur.skills,[skillId]:{status:'mastered',best:Math.max(score,cur.skills[skillId]?.best||0),lvl:lvl||cur.skills[skillId]?.lvl||1}}; const idx=def.skills.findIndex(x=>x.id===skillId); const next=def.skills[idx+1]; if(next && (!skills[next.id]||skills[next.id].status==='locked')) skills[next.id]={status:'available',best:0,lvl:1}; const t=todayKey(s.user.simDays); const others=cur.reviews.filter(r=>r.skillId!==skillId); const reviews=[...others,...REVIEW_STAGES.map((d,i)=>({skillId,due:t+d*DAY,stage:i}))]; const dd=dayOf(s.user,t); return {...s, user:{...s.user, daily:{...dd, lessons:dd.lessons+1}}, courses:{...s.courses,[cid]:{...cur,skills,reviews}}}; }); },[]);
  const completeReview = useCallback((skillId)=>{ setState(s=>{ const cid=s.currentCourse; const cur=s.courses[cid]; const t=todayKey(s.user.simDays); const due=cur.reviews.filter(r=>r.skillId===skillId && r.due<=t).sort((a,b)=>a.stage-b.stage); let reviews=cur.reviews; if(due[0]) reviews=cur.reviews.filter(r=>r!==due[0]); return {...s,courses:{...s.courses,[cid]:{...cur,reviews}}}; }); },[]);

  const applyDiagnostic = useCallback((results)=>{ setState(s=>{ const cid=s.currentCourse; const def=findCourse(cid); const cur=s.courses[cid]||emptyCourse(); const skills={}; let reviews=[...cur.reviews]; const t=todayKey(s.user.simDays);
    def.skills.forEach(sk=>{ skills[sk.id]={status:'locked',best:0,lvl:1}; });
    Object.entries(results).forEach(([id,r])=>{ if(r.ok && skills[id]){ const score=r.d>=3?100:r.d>=2?85:70; skills[id]={status:'mastered',best:score,lvl:r.d}; REVIEW_STAGES.forEach((d,i)=>reviews.push({skillId:id,due:t+d*DAY,stage:i})); } });
    const firstOpen=def.skills.find(sk=>skills[sk.id].status!=='mastered'); if(firstOpen) skills[firstOpen.id]={...skills[firstOpen.id],status:'available'};
    return {...s,courses:{...s.courses,[cid]:{...cur,skills,reviews,diagnosticDone:true}}}; }); },[]);

  const setName = useCallback((name)=>setState(s=>({...s,user:{...s.user,name}})),[]);
  const setCourse = useCallback((cid)=>setState(s=>({...s,currentCourse:cid,courses:{...s.courses,[cid]:s.courses[cid]||emptyCourse()}})),[]);
  const exitCourse = useCallback(()=>setState(s=>({...s,currentCourse:null})),[]);
  const timeTravel = useCallback((days)=>setState(s=>({...s,user:{...s.user,simDays:s.user.simDays+days}})),[]);
  const reset = useCallback(()=>{ localStorage.removeItem(STORE_KEY); setState(defaultState()); },[]);
  const dueReviews = useMemo(()=>{ const cid=state.currentCourse; const cur=cid?state.courses[cid]:null; if(!cur) return []; const t=now(); const seen=new Set(); return cur.reviews.filter(r=>r.due<=t).filter(r=>{ if(seen.has(r.skillId))return false; seen.add(r.skillId); return true; }); },[state.courses,state.currentCourse,state.user.simDays]);

  return { state, course, cp, daily, now, addXp, claimMission, masterSkill, completeReview, applyDiagnostic, setName, setCourse, exitCourse, timeTravel, reset, dueReviews };
}

/* ============================ UI base ============================ */
function Bar({value, className=''}){ return <div className={"h-2 rounded-full bg-slate-200 overflow-hidden "+className}><div className="h-full bg-teal-500 transition-all duration-500" style={{width:clamp(value,0,100)+'%'}}/></div>; }
function DiffChip({d}){ const x=DIFF[d]; return <span className={"text-xs px-2 py-0.5 rounded-full border font-semibold "+x.cls}>{x.emo} {x.n}</span>; }

function TopBar({app}){ const {user}=app.state; const lvl=levelOf(user.xp); const nxt=nextLevel(user.xp); const prog=nxt?((user.xp-lvl.min)/(nxt.min-lvl.min))*100:100;
  return (<div className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200"><div className="max-w-xl mx-auto px-4 py-2 flex items-center gap-3">

  </div></div>); }

/* ============================ Exercício (mc, num, tf, err, order) ============================ */
function Exercise({item, mode, adaptive, onDone}){
  // normaliza tf e err para o caminho de múltipla escolha
  let type=item.type, options=item.options, correct=item.a, prompt=item.q;
  if(type==='tf'){ options=['✅ Verdadeiro','❌ Falso']; correct=item.a?0:1; type='mc'; }
  if(type==='err'){ options=item.steps; correct=item.a; type='mc'; }

  const [sel,setSel]=useState(null); const [numVal,setNumVal]=useState('');
  const [orderPick,setOrderPick]=useState([]);
  const shuffled = useMemo(()=> item.type==='order'? shuffle(item.steps.map((s,i)=>({s,i}))) : null, [item]);
  const [phase,setPhase]=useState('idle'); const [ok,setOk]=useState(false);
  const [showHint,setShowHint]=useState(false); const [showSol,setShowSol]=useState(false);
  const isDiag = mode==='diag'||mode==='exam';

  const canCheck = type==='mc' ? sel!=null : item.type==='num' ? numVal.trim()!=='' : item.type==='order' ? orderPick.length===item.steps.length : false;

  const check=()=>{
    let c=false;
    if(type==='mc') c = sel===correct;
    else if(item.type==='num'){ const v=parseFloat(String(numVal).replace(',','.')); c=!isNaN(v)&&Math.abs(v-item.a)<=(item.tol||0.001); }
    else if(item.type==='order'){ c = orderPick.every((p,i)=> shuffled[p].i===i); }
    setOk(c); setPhase('result'); if(!c && adaptive) setShowHint(true);
  };
  const retry=()=>{ setPhase('idle'); setSel(null); setNumVal(''); setOrderPick([]); setShowSol(false); };
  const toggleOrder=(pi)=>{ setOrderPick(prev=> prev.includes(pi)? prev.filter(x=>x!==pi) : [...prev,pi]); };

  const typeBadge = { tf:'Verdadeiro ou Falso', err:'Ache o erro', order:'Ordene os passos' }[item.type];

  return (<div className="fade-in">
    <div className="flex flex-wrap gap-2 mb-2">
      {item.src && <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200 font-medium">{item.src==='Stewart'?'📘':item.src==='Guidorizzi'?'📗':'📄'} {item.src}</span>}
      {typeBadge && <span className="text-[11px] px-2 py-0.5 rounded-full bg-purple-50 text-purple-600 border border-purple-200 font-medium">🧠 {typeBadge}</span>}
      {item.gen && <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200 font-medium">♾️ gerado</span>}
    </div>
    <div className="text-slate-800 text-lg mb-4 leading-relaxed"><Rich s={prompt} block/></div>
    {item.type==='err' && <p className="text-sm text-slate-500 -mt-2 mb-3">Toque no passo que contém o erro:</p>}

    {type==='mc' ? (
      <div className="grid gap-2">{options.map((opt,i)=>{ const chosen=sel===i; const right=phase==='result'&&i===correct; const wrong=phase==='result'&&chosen&&i!==correct;
        return <button key={i} disabled={phase==='result'} onClick={()=>phase!=='result'&&setSel(i)}
          className={"text-left px-4 py-3 rounded-xl border-2 transition min-h-[52px] "+(right?'border-teal-500 bg-teal-50':wrong?'border-red-400 bg-red-50 shake':chosen?'border-teal-500 bg-teal-50':'border-slate-200 bg-white active:scale-[.99]')}>
          {item.type==='err' && <span className="text-slate-400 mr-2">{i+1}.</span>}<Rich s={opt}/></button>; })}</div>
    ) : item.type==='num' ? (
      <input type="text" inputMode="decimal" value={numVal} disabled={phase==='result'} onChange={e=>setNumVal(e.target.value)} placeholder="Digite sua resposta"
        className={"w-full px-4 py-3 rounded-xl border-2 text-lg outline-none "+(phase==='result'?(ok?'border-teal-500 bg-teal-50':'border-red-400 bg-red-50 shake'):'border-slate-200 focus:border-teal-400')}/>
    ) : ( /* order */
      <div>
        <div className="grid gap-2 mb-3">{shuffled.map((o,pi)=>{ const pos=orderPick.indexOf(pi); const chosen=pos>=0;
          return <button key={pi} disabled={phase==='result'} onClick={()=>phase!=='idle'?null:toggleOrder(pi)}
            className={"flex items-center gap-2 text-left px-4 py-3 rounded-xl border-2 min-h-[52px] "+(chosen?'border-teal-500 bg-teal-50':'border-slate-200 bg-white active:scale-[.99]')}>
            <span className={"w-6 h-6 shrink-0 rounded-full grid place-items-center text-xs font-bold "+(chosen?'bg-teal-500 text-white':'bg-slate-100 text-slate-400')}>{chosen?pos+1:''}</span>
            <Rich s={o.s}/></button>; })}</div>
      </div>
    )}

    {phase==='result' && ok && <div className="mt-3 text-teal-700 font-semibold pop">✅ Isso aí!</div>}
    {phase==='result' && !ok && <div className="mt-3 text-sm text-red-600">{mode==='exam'?'Resposta incorreta.':mode==='diag'?'Sem problema — isso entra na sua trilha.':'Não foi dessa vez. 💪'}</div>}
    {phase==='result' && item.type==='order' && <div className="mt-2 text-sm text-slate-600">Ordem correta: {item.steps.map((s,i)=><span key={i} className="inline-block mr-2">{i+1}) <T s={s}/></span>)}</div>}

    {(showHint || (phase==='result' && !ok && item.hint)) && item.hint && <div className="mt-3 text-sm bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-800">💡 <b>Dica:</b> {item.hint}</div>}
    {phase==='result' && (ok||showSol) && item.sol && <div className="mt-3 text-sm bg-slate-50 rounded-lg p-3 text-slate-700"><b>Solução:</b> <T s={item.sol}/></div>}

    <div className="mt-4 flex gap-2">
      {phase==='idle' && <button onClick={check} disabled={!canCheck} className="flex-1 bg-teal-600 disabled:opacity-40 text-white font-semibold py-3 rounded-xl active:scale-[.98]">Verificar</button>}
      {phase==='result' && ok && <button onClick={()=>onDone(true)} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl active:scale-[.98]">Continuar →</button>}
      {phase==='result' && !ok && isDiag && <button onClick={()=>onDone(false)} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl">Continuar →</button>}
      {phase==='result' && !ok && !isDiag && !showSol && <>
        {!showHint && item.hint && <button onClick={()=>setShowHint(true)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-600">Dica</button>}
        <button onClick={retry} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl">Tentar de novo</button>
        {item.sol && <button onClick={()=>setShowSol(true)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-500 text-sm">Solução</button>}
        {!item.sol && <button onClick={()=>onDone(false)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-500 text-sm">Pular</button>}
      </>}
      {phase==='result' && !ok && !isDiag && showSol && <button onClick={()=>onDone(false)} className="flex-1 bg-slate-600 text-white font-semibold py-3 rounded-xl">Continuar →</button>}
    </div>
  </div>);
}

/* ============================ Flashcards ============================ */
function Flashcards({skill, onDone}){

        </div>

          <div><div className="text-[11px] uppercase tracking-wide text-teal-100 mb-2">Verso</div><div className="text-xl"><Rich s={c[1]} block/></div></div>

      : (<button onClick={()=>setFlip(true)} className="w-full mt-4 bg-teal-600 text-white font-semibold py-3 rounded-xl">Ver resposta</button>)}

/* ============================ Motor adaptativo (aula/revisão) ============================ */
function AdaptiveExercises({skill, startDiff, target, escalate, reviewMode, onCorrect, onFinish}){
  const [diff,setDiff]=useState(startDiff||1);
  const [used,setUsed]=useState([]);
  const [item,setItem]=useState(()=>{ const n=nextExercise(skill,[],startDiff||1,false); return n.__idx!=null? skill.pool[n.__idx] : n; });
  const [curIdx,setCurIdx]=useState(()=>{ const n=nextExercise(skill,[],startDiff||1,false); return n.__idx!=null?n.__idx:-1; });
  const [correctCount,setCorrectCount]=useState(0); const [bestDiff,setBestDiff]=useState(0);
  const [cStreak,setCStreak]=useState(0); const [wStreak,setWStreak]=useState(0); const [flash,setFlash]=useState(null); const [tick,setTick]=useState(0);
  const needed=Math.min(target, skill.pool.length + (skill.gen?2:0));
  const register = (wStreak>=1 || diff===1) ? 'simples' : (diff===3 ? 'desafio' : 'padrao');

  const handle=(correct)=>{
    let nUsed = curIdx>=0 ? [...used,curIdx] : used;
    let nCorrect=correctCount, nBest=bestDiff, nC=cStreak, nW=wStreak, nDiff=diff, fl=null;
    if(correct){ onCorrect(); nCorrect++; nBest=Math.max(nBest,item.d||diff); nC++; nW=0; if(escalate && nC>=2 && nDiff<3){ nDiff++; nC=0; fl='up'; } }
    else { nW++; nC=0; if(nDiff>1){ nDiff--; if(escalate) fl='down'; } }
    if(nCorrect>=needed){ onFinish(nBest||1); return; }
    const n=nextExercise(skill, nUsed, nDiff, false);
    let nextItem, nextIdx;
    if(n.__idx!=null){ nextIdx=n.__idx; nextItem=skill.pool[n.__idx]; } else { nextIdx=-1; nextItem=n; }
    setUsed(nUsed); setCorrectCount(nCorrect); setBestDiff(nBest); setCStreak(nC); setWStreak(nW); setDiff(nDiff); setItem(nextItem); setCurIdx(nextIdx); setFlash(fl); setTick(t=>t+1);
    if(fl) setTimeout(()=>setFlash(null),1400);
  };

  return (<div>
    <div className="flex justify-between items-center text-xs text-slate-500 mb-2"><span>{reviewMode?'Revisão':'Progresso'}: {correctCount}/{needed} ✓</span><DiffChip d={item.d||diff}/></div>
    <Bar value={(correctCount/needed)*100} className="mb-3"/>
    {flash==='up' && <div className="mb-3 text-sm bg-red-50 border border-red-200 text-red-700 rounded-lg p-2.5 pop">🔥 Mandou bem! Subindo a dificuldade.</div>}
    {flash==='down' && <div className="mb-3 text-sm bg-green-50 border border-green-200 text-green-700 rounded-lg p-2.5">🧩 Vamos com calma — voltando um nível.</div>}
    {register==='simples' && !flash && <div className="mb-3 text-xs text-teal-700 bg-teal-50 rounded-lg p-2.5">🧩 Modo passo a passo: leia a dica e vá com calma.</div>}
    {register==='desafio' && !flash && <div className="mb-3 text-xs text-red-700 bg-red-50 rounded-lg p-2.5">🔥 Modo desafio ativado!</div>}
    <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">

    <p className="text-xs text-slate-400 mt-6">Seu progresso fica salvo só neste aparelho.</p></div>); }

function Diagnostic({app}){
  const [st,setSt]=useState(()=>({ i:0, curDiff:2, bandStreak:0, results:{} }));
  const CURR=app.course.skills; const skill=CURR[st.i]; const item=pickDiagItem(skill, st.curDiff);
  const answer=(correct)=>{
    const results={...st.results,[skill.id]:{ok:correct,d:st.curDiff}};
    let bandStreak=correct?st.bandStreak+1:0; let curDiff=correct?Math.min(3,st.curDiff+1):Math.max(1,st.curDiff-1);
    let next=st.i+1; const band=skill.level;
    if(app.course.id==='calc' && band!=='sup' && bandStreak>=2){ while(next<CURR.length && CURR[next].level===band){ results[CURR[next].id]={ok:true,d:st.curDiff,skip:true}; next++; } }
    if(next>=CURR.length){ app.applyDiagnostic(results); return; }
    if(CURR[next].level!==band){ curDiff=2; bandStreak=0; }
    setSt({i:next,curDiff,bandStreak,results});
  };
  const answered=Object.keys(st.results).length;
  return (<div className="max-w-xl mx-auto px-5 pt-6 pb-24">
    <div className="mb-4"><div className="flex justify-between text-xs text-slate-500 mb-1"><span>Teste de nível adaptativo</span><span>{answered} respondidas</span></div><Bar value={(st.i/CURR.length)*100}/></div>
    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
      <div className="flex items-center justify-between mb-3"><p className="text-xs uppercase tracking-wide text-teal-600 font-semibold">{skill.mod}</p><DiffChip d={st.curDiff}/></div>
      <Exercise key={st.i} mode="diag" adaptive={false} item={{...item, hint:item.hint||'Se não lembrar, tudo bem — entra na sua trilha.'}} onDone={answer}/>
    </div>
    <p className="text-center text-xs text-slate-400 mt-4">A dificuldade sobe quando você acerta e desce quando erra. Acertos você pula (voltam em revisão).</p>
  </div>);
}

function Lesson({app, skillId, onDone, reviewMode}){
  const skill=app.course.skills.find(s=>s.id===skillId); const [tab,setTab]=useState(reviewMode?'ex':'learn');

    {tab==='learn' ? (<div className="fade-in">

        if(b.t==='p') return <p key={i} className="text-slate-700 leading-relaxed mb-3"><Rich s={b.c}/></p>;
        if(b.t==='f') return <div key={i} className="bg-slate-50 rounded-lg py-2 px-3 mb-3"><M tex={b.c} block/></div>;

        if(b.t==='err') return <div key={i} className="bg-red-50 border border-red-200 rounded-lg p-3 mb-3 text-red-700 text-sm">⚠️ <Rich s={b.c}/></div>;

function PracticeSession({app, skill, onExit}){
  // skill pode ser um objeto skill ou null (mistão)
  const unlocked = app.course.skills.filter(s=> ['available','mastered'].includes(app.cp.skills[s.id]?.status));
  const chooseSkill = ()=> skill || pick(unlocked);
  const build=()=>{ const s=chooseSkill(); const n=nextExercise(s, [], ri(1,3), true); const it=n.__idx!=null? s.pool[n.__idx] : n; return {s, it}; };
  const [cur,setCur]=useState(build); const [count,setCount]=useState(0); const [hits,setHits]=useState(0); const [tick,setTick]=useState(0);
  const handle=(ok)=>{ if(ok){ app.addXp(5,'Prática: '+cur.s.title); setHits(h=>h+1); } setCount(c=>c+1); setCur(build()); setTick(t=>t+1); };
  return (<div className="max-w-xl mx-auto px-4 pt-3 pb-28">
    <button onClick={onExit} className="text-slate-500 text-sm mb-2">← Sair da prática</button>
    <div className="flex items-center justify-between mb-3"><div><div className="font-bold text-slate-800">{skill?skill.title:'Mistão 🎲'}</div><div className="text-xs text-slate-500">Treino livre — infinito, sem pressão</div></div>
      <div className="text-right"><div className="text-lg font-bold text-teal-600">{hits}/{count}</div><div className="text-[11px] text-slate-400">acertos</div></div></div>
    {!skill && <div className="text-xs text-purple-600 bg-purple-50 rounded-lg p-2 mb-3">Tópico atual: {cur.s.title}</div>}
    <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><Exercise key={tick} mode="practice" adaptive={false} item={cur.it} onDone={handle}/></div>
  </div>);
}

        {claimed ? <span className="text-teal-600 text-xs font-semibold">✓ feita</span> : done ? <button onClick={()=>app.claimMission(m.id,m.bonus)} className="bg-amber-400 text-amber-900 text-xs font-bold px-2.5 py-1.5 rounded-lg pop">+{m.bonus} XP</button> : <span className="text-[11px] text-slate-300">+{m.bonus}</span>}
      </div>); })}</div></div>);
}
const BADGES=[
  {id:'s3', icon:'🔥', name:'Constância', desc:'3 dias seguidos', has:(u,c)=>u.streak>=3},
  {id:'s7', icon:'📅', name:'Semana cheia', desc:'7 dias seguidos', has:(u,c)=>u.streak>=7},
  {id:'x500', icon:'💎', name:'500 XP', desc:'500 XP', has:(u,c)=>u.xp>=500},
  {id:'x1000', icon:'👑', name:'1000 XP', desc:'1000 XP', has:(u,c)=>u.xp>=1000},
  {id:'m5', icon:'🎯', name:'Aplicado', desc:'5 tópicos', has:(u,c)=>c.done>=5},
  {id:'m10', icon:'🏅', name:'Dedicado', desc:'10 tópicos', has:(u,c)=>c.done>=10},
];
function Badges({app, done}){ const u=app.state.user; const ctx={done};
  return (<div className="mb-6"><h3 className="text-sm font-bold text-slate-700 mb-2">🏆 Conquistas</h3>
    <div className="grid grid-cols-3 gap-2">{BADGES.map(b=>{ const got=b.has(u,ctx);
      return (<div key={b.id} className={"rounded-xl p-3 text-center border "+(got?'bg-amber-50 border-amber-200':'bg-slate-50 border-slate-100 opacity-50')}>
        <div className="text-2xl">{got?b.icon:'🔒'}</div><div className="text-[11px] font-semibold text-slate-700 mt-1">{b.name}</div><div className="text-[10px] text-slate-400">{b.desc}</div></div>); })}</div></div>);
}

/* ============================ Mapa mental ============================ */
const TINTS=['bg-teal-100 text-teal-700 border-teal-200','bg-indigo-100 text-indigo-700 border-indigo-200','bg-amber-100 text-amber-700 border-amber-200','bg-rose-100 text-rose-700 border-rose-200','bg-violet-100 text-violet-700 border-violet-200','bg-emerald-100 text-emerald-700 border-emerald-200'];
function MindMap({course, onBack}){
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28 fade-in">
    <button onClick={onBack} className="text-slate-500 text-sm mb-3">← Voltar</button>
    <h1 className="text-2xl font-bold text-slate-800 mb-1">🗺️ Mapa mental</h1>
    <p className="text-slate-500 text-sm mb-5">{course.icon} {course.title} — veja o todo e as conexões.</p>
    <div className="text-center mb-4"><span className="inline-block bg-slate-800 text-white font-bold rounded-full px-5 py-2">{course.icon} {course.title}</span></div>
    <div className="space-y-4">{course.modules.map((m,i)=>{ const items=course.skills.filter(s=>s.mod===m); const tint=TINTS[i%TINTS.length];
      return (<div key={m} className="relative pl-4 border-l-2 border-slate-200">
        <div className={"inline-block rounded-lg px-3 py-1.5 border font-semibold text-sm "+tint}>{m}</div>
        <div className="flex flex-wrap gap-1.5 mt-2">{items.map(s=><span key={s.id} className="bg-white border border-slate-200 rounded-full px-2.5 py-1 text-xs text-slate-600">{s.icon} {s.title}</span>)}</div>
      </div>); })}</div>
    <p className="text-center text-xs text-slate-400 mt-6">💡 Use este mapa para se autoexplicar (Feynman) e revisar antes das provas.</p>
  </div>);
}

/* ============================ Pomodoro (foco temporal) ============================ */
function Pomodoro(){
  const FOCO=25*60, PAUSA=5*60;
  const [mode,setMode]=useState('foco'); const [left,setLeft]=useState(FOCO);
  const [run,setRun]=useState(false); const [open,setOpen]=useState(false); const [cycles,setCycles]=useState(0);
  useEffect(()=>{ if(!run) return; const id=setInterval(()=>{ setLeft(l=>{ if(l<=1){ if(mode==='foco'){ setMode('pausa'); setCycles(c=>c+1); return PAUSA; } setMode('foco'); return FOCO; } return l-1; }); },1000); return ()=>clearInterval(id); },[run,mode]);
  const mmss=(s)=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const reset=()=>{ setRun(false); setMode('foco'); setLeft(FOCO); };
  return (<div className="fixed right-3 bottom-20 z-30">
    {open ? (<div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-4 w-52 pop">
      <div className="flex justify-between items-center mb-1"><span className="text-sm font-bold text-slate-700">🍅 Pomodoro</span><button onClick={()=>setOpen(false)} className="text-slate-400 text-sm">✕</button></div>
      <div className={"text-center rounded-xl py-3 mb-2 "+(mode==='foco'?'bg-red-50 text-red-600':'bg-teal-50 text-teal-600')}><div className="text-[11px] uppercase tracking-wide">{mode==='foco'?'Foco (25 min)':'Pausa (5 min)'}</div><div className="text-3xl font-bold tabular-nums">{mmss(left)}</div></div>
      <div className="flex gap-2"><button onClick={()=>setRun(r=>!r)} className="flex-1 bg-teal-600 text-white rounded-lg py-2 text-sm font-semibold">{run?'Pausar':'Iniciar'}</button><button onClick={reset} className="px-3 rounded-lg border border-slate-200 text-slate-500 text-sm">↺</button></div>
      <div className="text-[11px] text-slate-400 text-center mt-2">Ciclos de foco: {cycles}</div>
    </div>) : (<button onClick={()=>setOpen(true)} className={"w-14 h-14 rounded-full shadow-lg grid place-items-center text-white "+(run?(mode==='foco'?'bg-red-500':'bg-teal-500'):'bg-slate-700')}>{run? <span className="text-[11px] font-bold tabular-nums">{mmss(left)}</span> : <span className="text-2xl">🍅</span>}</button>)}
  </div>);
}

/* ============================ Feynman (autoexplicação) ============================ */
function FeynmanCard({skill}){
  const [txt,setTxt]=useState(''); const [show,setShow]=useState(false);
  const modelo = skill.theory.filter(b=>b.t==='p'||b.t==='met').slice(0,2);
  return (<div className="mt-4 bg-violet-50 border border-violet-200 rounded-2xl p-4">
    <h4 className="text-sm font-bold text-violet-700 mb-1">🧠 Autoexplicação (método Feynman)</h4>
    <p className="text-xs text-violet-600 mb-2">Explique "{skill.title}" com suas palavras, como se ensinasse alguém — sem olhar o material. É o teste real de que você entendeu.</p>
    <textarea value={txt} onChange={e=>setTxt(e.target.value)} rows={3} placeholder="Escreva sua explicação aqui..." className="w-full rounded-lg border border-violet-200 p-2 text-sm outline-none focus:border-violet-400"/>
    <button onClick={()=>setShow(s=>!s)} className="mt-2 text-sm text-violet-700 font-medium border border-violet-300 rounded-lg px-3 py-1.5">{show?'Ocultar':'Comparar com a explicação-modelo'}</button>
    {show && <div className="mt-2 text-sm text-slate-700 bg-white rounded-lg p-3 border border-violet-100">{modelo.map((b,i)=><p key={i} className="mb-1">{b.c}</p>)}</div>}
  </div>);
}

/* ============================ Simulado (estudo ativo, cronometrado) ============================ */
function SimuladoSession({app, onExit}){
  const N=8;
  const items = useMemo(()=>{ const un=app.course.skills.filter(s=>['available','mastered'].includes(app.cp.skills[s.id]?.status)); const arr=[]; for(let k=0;k<N;k++){ const s=pick(un); const n=nextExercise(s,[],ri(1,3),true); arr.push({s, it: n.__idx!=null? s.pool[n.__idx] : n}); } return arr; },[]);
  const [i,setI]=useState(0); const [score,setScore]=useState(0); const [left,setLeft]=useState(N*90); const [done,setDone]=useState(false);
  useEffect(()=>{ if(done) return; if(left<=0){ setDone(true); return; } const id=setInterval(()=>setLeft(l=>l-1),1000); return ()=>clearInterval(id); },[left,done]);
  const mmss=(s)=>{ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
  const answer=(ok)=>{ if(ok){ setScore(x=>x+1); app.addXp(8,'Simulado: '+items[i].s.title); } if(i+1>=N) setDone(true); else setI(i+1); };
  if(done) return (<div className="max-w-xl mx-auto px-4 pt-10 pb-28 text-center fade-in"><div className="text-5xl">📝</div><h2 className="text-xl font-bold text-slate-800 mt-2">Simulado concluído!</h2><p className="text-4xl font-bold text-teal-600 my-3">{score}/{N}</p><p className="text-sm text-slate-500 mb-6">{score>=Math.ceil(N*0.7)?'Mandou bem! 🎉':'Continue praticando e revise os tópicos que errou.'}</p><button onClick={onExit} className="bg-teal-600 text-white font-semibold px-6 py-3 rounded-xl">Voltar</button></div>);
  return (<div className="max-w-xl mx-auto px-4 pt-3 pb-28">
    <div className="flex items-center justify-between mb-3"><button onClick={onExit} className="text-slate-500 text-sm">← Sair</button><div className={"font-bold tabular-nums "+(left<60?'text-red-600':'text-slate-700')}>⏱ {mmss(left)}</div></div>
    <div className="flex justify-between text-xs text-slate-500 mb-2"><span>Questão {i+1}/{N}</span><span>Acertos: {score}</span></div>
    <Bar value={(i/N)*100} className="mb-3"/>
    <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><Exercise key={i} mode="exam" adaptive={false} item={items[i].it} onDone={answer}/></div>
  </div>);
}

/* ============================ Plano de estudos (trilha + métodos) ============================ */
function Plano({app, onBack, onMap}){
  const PATH=[
    {t:'Base — Play Cálculo', d:'Frações, potências, raízes, álgebra, fatoração e equações', dep:'ponto de partida'},
    {t:'Ensino Médio', d:'Funções, afim, quadrática, exponencial/logaritmo, trigonometria', dep:'precisa da Base'},
    {t:'Cálculo I', d:'Limites → Continuidade → Derivadas → Aplicações → Integrais', dep:'precisa de Funções'},
    {t:'Física Básica (Mecânica)', d:'Vetores, cinemática, Newton, energia, momento, rotação', dep:'usa derivadas e integrais'},
    {t:'Ciências Aeroespaciais', d:'Gravitação, fluidos, calor/termodinâmica, oscilações e ondas', dep:'usa Cálculo + Física'},
  ];
  const METHODS=[
    ['🍅','Pomodoro','25 min de foco + 5 de pausa','timer flutuante (canto da tela)'],
    ['🧠','Feynman / Autoexplicação','explique com suas palavras','card na aba Aprender'],
    ['🔁','Repetição espaçada','revise em D+0, D+7 e D+30','revisões automáticas na Home'],
    ['🃏','Flashcards','pergunta na frente, resposta no verso','aba Cartões de cada tópico'],
    ['📝','Simulado / estudo ativo','resolva provas cronometradas','Praticar → Simulado'],
    ['🔀','Intercalação (ciclo de estudos)','alterne tópicos, não um só','Praticar → Mistão'],
    ['🗺️','Mapa mental','veja o todo e as conexões','este plano de estudos'],
  ];
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28 fade-in">
    <button onClick={onBack} className="text-slate-500 text-sm mb-3">← Voltar</button>
    <h1 className="text-2xl font-bold text-slate-800 mb-1">📋 Plano de estudos</h1>
    <p className="text-slate-500 text-sm mb-5">A ordem lógica do aprendizado — cada etapa apoia a próxima.</p>
    <div className="pl-5 mb-8">{PATH.map((p,i)=>(<div key={i} className="relative pb-3 pl-4 border-l-2 border-teal-200 last:border-transparent">
      <div className="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-teal-500"></div>
      <div className="bg-white rounded-xl p-3 border border-slate-100"><div className="font-bold text-slate-800 text-sm">{i+1}. {p.t}</div><div className="text-xs text-slate-500 mt-0.5">{p.d}</div><div className="text-[11px] text-teal-600 mt-1">↳ {p.dep}</div></div>
    </div>))}</div>
    <h2 className="text-lg font-bold text-slate-800 mb-2">🎓 Métodos de estudo</h2>
    <p className="text-xs text-slate-500 mb-3">O app foi desenhado em torno de aprendizagem ativa. Cada técnica tem um lugar aqui:</p>
    <div className="grid gap-2">{METHODS.map((m,i)=>(<div key={i} className="flex gap-3 bg-white rounded-xl p-3 border border-slate-100"><div className="text-2xl">{m[0]}</div><div className="flex-1"><div className="font-semibold text-slate-800 text-sm">{m[1]}</div><div className="text-xs text-slate-500">{m[2]}</div><div className="text-[11px] text-teal-600 mt-0.5">No app: {m[3]}</div></div></div>))}</div>
    <h2 className="text-lg font-bold text-slate-800 mt-6 mb-2">🗺️ Mapas mentais</h2>
    <p className="text-xs text-slate-500 mb-3">Esquema visual de cada curso — ótimo para revisar e se autoexplicar.</p>
    <div className="grid gap-2">{COURSES.map(c=>(<button key={c.id} onClick={()=>onMap(c.id)} className="w-full flex items-center gap-3 bg-white rounded-xl p-3 border border-slate-100 text-left active:scale-[.99]"><span className="text-xl">{c.icon}</span><span className="flex-1 text-sm font-medium text-slate-800">{c.title}</span><span className="text-slate-400 text-sm">→</span></button>))}</div>
  </div>);
}

/* ============================ Seletor de curso ============================ */
function CoursePicker({app, onPlano}){
  return (<div className="max-w-xl mx-auto px-4 pt-6 pb-28 fade-in">
    <h1 className="text-2xl font-bold text-slate-800 mb-1">Olá, {app.state.user.name}! 👋</h1>
    <p className="text-slate-500 text-sm mb-6">Escolha um curso para estudar — seu 🔥 streak e XP valem para todos.</p>
    <div className="grid gap-3">{COURSES.map(c=>{ const cp=app.state.courses[c.id]; const done=cp?Object.values(cp.skills).filter(x=>x.status==='mastered').length:0; const total=c.skills.length; const started=!!cp&&cp.diagnosticDone;
      return (<button key={c.id} onClick={()=>app.setCourse(c.id)} className="w-full text-left bg-white border border-slate-200 shadow-sm rounded-2xl p-5 active:scale-[.99]">
        <div className="flex items-center gap-3"><div className="w-12 h-12 rounded-xl bg-teal-100 grid place-items-center text-2xl">{c.icon}</div>
          <div className="flex-1"><div className="font-bold text-slate-800">{c.title}</div><div className="text-xs text-slate-500">{c.desc}</div></div>
          <span className="text-teal-600 text-sm font-semibold">{started?'Continuar →':'Começar →'}</span></div>
        {started ? (<div className="mt-3"><Bar value={(done/total)*100}/><div className="text-[11px] text-slate-400 mt-1">{done}/{total} tópicos dominados</div></div>)
          : (<div className="mt-3 text-[11px] text-slate-400">{total} tópicos · começa com um teste de nível adaptativo</div>)}
      </button>); })}</div>
    <button onClick={onPlano} className="w-full mt-4 bg-white border border-slate-200 rounded-2xl p-4 text-left active:scale-[.99] flex items-center gap-3"><span className="text-2xl">📋</span><div><div className="font-bold text-slate-800 text-sm">Plano de estudos & métodos</div><div className="text-xs text-slate-500">Ordem lógica do conteúdo + técnicas de estudo</div></div></button>
  </div>);
}

/* ============================ App ============================ */
function App(){ const app=useApp(); const [tab,setTab]=useState('home'); const [lesson,setLesson]=useState(null); const [celebrate,setCelebrate]=useState(false); const [showPlano,setShowPlano]=useState(false); const [mapCourse,setMapCourse]=useState(null);
  if(!app.state.user.name) return <Onboarding app={app}/>;
  if(mapCourse) return <><TopBar app={app}/><MindMap course={findCourse(mapCourse)} onBack={()=>setMapCourse(null)}/></>;
  if(showPlano) return <><TopBar app={app}/><Plano app={app} onBack={()=>setShowPlano(false)} onMap={(cid)=>{setShowPlano(false);setMapCourse(cid);}}/></>;
  if(!app.state.currentCourse) return <><TopBar app={app}/><CoursePicker app={app} onPlano={()=>setShowPlano(true)}/></>;
  if(!app.cp.diagnosticDone) return <><TopBar app={app}/><Diagnostic app={app}/></>;
  const openSkill=(id)=>setLesson({skillId:id,review:false}); const startReview=(id)=>setLesson({skillId:id,review:true});
  const closeLesson=(completed)=>{ setLesson(null); if(completed){ setCelebrate(true); setTimeout(()=>setCelebrate(false),1500);} };
  return (<div className="min-h-screen"><TopBar app={app}/>
    {lesson ? (<Lesson app={app} skillId={lesson.skillId} reviewMode={lesson.review} onDone={closeLesson}/>) : (<>
      {tab==='home' && <Home app={app} openSkill={openSkill} startReview={startReview} goTrilha={()=>setTab('trilha')} goPractice={()=>setTab('practice')}/>}
      {tab==='trilha' && <Trilha app={app} openSkill={openSkill} onMap={()=>setMapCourse(app.state.currentCourse)}/>}
      {tab==='practice' && <Practice app={app}/>}
      {tab==='profile' && <Profile app={app} onPlano={()=>setShowPlano(true)}/>}</>)}
    {!lesson && <TabBar tab={tab} setTab={setTab} dueCount={app.dueReviews.length}/>}
    <Pomodoro/>
    {celebrate && (<div className="fixed inset-0 z-50 grid place-items-center bg-black/30 pointer-events-none"><div className="bg-white rounded-2xl px-8 py-6 text-center pop"><div className="text-5xl">🎉</div><p className="font-bold text-slate-800 mt-2">Muito bem!</p><p className="text-sm text-slate-500">Conteúdo concluído e revisões agendadas.</p></div></div>)}
  </div>); }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- Bootstrap clássico: compila o JSX com runtime 'classic' (React.createElement, sem imports ESM) -->
<script>
(function boot(){
  if (typeof Babel === 'undefined' || typeof React === 'undefined' || typeof ReactDOM === 'undefined') { return setTimeout(boot, 40); }
  try {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#b91c1c;white-space:pre-wrap;font:13px monospace">Erro ao iniciar:\n' + (e && e.stack ? e.stack : e) + '</pre>';
    console.error(e);
  }
})();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW falhou:', e); }); });
}
</script>

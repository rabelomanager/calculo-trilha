<script type="text/plain" id="app-src">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================ UTIL ============================ */
const DAY = 86400000;
const todayKey = (offset=0) => { const d = new Date(Date.now() + offset*DAY); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const fmtDate = (ts) => new Date(ts).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const hasTex = (s)=> typeof s==='string' && /\\|\^|_|\{|\\frac|\\lim|\\int|\\sqrt/.test(s);
// aleatórios (para geradores)
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{ let x=0; while(x===0) x=ri(a,b); return x; };
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
const sgn=(n)=> (n>=0?`+ ${n}`:`- ${-n}`);
const shuffle=(arr)=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function M({ tex, block }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.katex) { try { window.katex.render(tex, ref.current, { throwOnError:false, displayMode: !!block }); } catch(e){ ref.current.textContent = tex; } }
    else if (ref.current) { ref.current.textContent = tex; }
  }, [tex, block]);
  return block ? <div className="my-2 overflow-x-auto text-center" ref={ref}>{tex}</div> : <span ref={ref}>{tex}</span>;
}
function T({s}){ return hasTex(s) ? <M tex={s}/> : <span>{s}</span>; }

const DIFF = {
  1:{n:'Fácil', emo:'🟢', cls:'text-green-700 bg-green-50 border-green-200'},
  2:{n:'Médio', emo:'🟡', cls:'text-amber-700 bg-amber-50 border-amber-200'},
  3:{n:'Difícil', emo:'🔴', cls:'text-red-700 bg-red-50 border-red-200'},
};

/* ============================ CONTEÚDO ============================
   Blocos de teoria: p, f(fórmula), met(metodologia), tip, err(erro comum), why(por que importa)
   Exercícios (pool graduado por d:1|2|3): tipos mc, num, tf, err(ache o passo errado), order(ordene)
   gen: geradores parametrizados -> prática infinita
   cards: flashcards [frente, verso]
================================================================== */
const P=(t)=>({t:'p',c:t}); const F=(t)=>({t:'f',c:t}); const TIP=(t)=>({t:'tip',c:t});
const MET=(t)=>({t:'met',c:t}); const ERR=(t)=>({t:'err',c:t}); const WHY=(t)=>({t:'why',c:t});
const mc=(d,q,options,a,hint,sol)=>({d,type:'mc',q,options,a,hint,sol,tex:true});
const nu=(d,q,a,tol,hint,sol)=>({d,type:'num',q,a,tol:tol||0.001,hint,sol});
const mcS=(d,q,options,a,hint,sol,src)=>({d,type:'mc',q,options,a,hint,sol,tex:true,src});
const nuS=(d,q,a,tol,hint,sol,src)=>({d,type:'num',q,a,tol:tol||0.001,hint,sol,src});
const tf=(d,q,a,hint,sol)=>({d,type:'tf',q,a,hint,sol});                    // a: true/false
const er=(d,q,steps,bad,hint,sol)=>({d,type:'err',q,steps,a:bad,hint,sol}); // bad: índice do passo errado
const od=(d,q,steps,hint)=>({d,type:'order',q,steps,hint});                 // steps na ordem correta

/* ---- geradores parametrizados (prática infinita) ---- */
function genFrac(){ const b=pick([2,3,4,5]), d2=pick([2,3,4,6]); const a=ri(1,b-1), c=ri(1,d2-1); const val=a/b+c/d2;
  return {d:2,type:'num',q:`Calcule \\frac{${a}}{${b}}+\\frac{${c}}{${d2}}. (decimal, 2 casas)`,a:Math.round(val*100)/100,tol:0.02,hint:'Denominador comum e some os numeradores.',sol:`= ${val.toFixed(3)}`,gen:true}; }
function genPot(){ const base=pick([2,3,5]), m=ri(2,4), n=ri(1,2); const val=Math.pow(base,m+n);
  return {d:2,type:'num',q:`Calcule ${base}^{${m}}\\cdot ${base}^{${n}}.`,a:val,tol:0.5,hint:'Mesma base: some os expoentes.',sol:`${base}^{${m+n}} = ${val}.`,gen:true}; }
function genEq1(){ const a=rnz(2,6), x=ri(-6,6), b=ri(-9,9); const c=a*x+b;
  return {d:2,type:'num',q:`Resolva ${a}x ${sgn(b)} = ${c}. x = ?`,a:x,tol:0.001,hint:'Isole x: passe o termo livre e divida.',sol:`${a}x = ${c-b} ⇒ x = ${x}.`,gen:true}; }
function genAfim(){ const a=rnz(-4,4), b=ri(-6,6), k=ri(-4,4); const val=a*k+b;
  return {d:2,type:'num',q:`Sendo f(x)=${a}x ${sgn(b)}, calcule f(${k}).`,a:val,tol:0.001,hint:'Substitua x pelo valor.',sol:`${a}·(${k}) ${sgn(b)} = ${val}.`,gen:true}; }
function genQuad(){ let r1=rnz(-5,5), r2=rnz(-5,5); const b=-(r1+r2), c=r1*r2; const mode=pick(['soma','produto']); const a= mode==='soma'? r1+r2 : r1*r2;
  return {d:3,type:'num',q:`Em x^2 ${sgn(b)}x ${sgn(c)}=0, qual a ${mode} das raízes?`,a,tol:0.001,hint:mode==='soma'?'Soma das raízes = -b.':'Produto das raízes = c.',sol:`Raízes ${r1} e ${r2}: ${mode} = ${a}.`,gen:true}; }
function genLim(){ let r=ri(-4,4), s=ri(-4,4); while(s===r) s=ri(-4,4); const b=-(r+s), c=r*s; const a=r-s;
  return {d:2,type:'num',q:`Calcule \\lim_{x\\to ${r}}\\frac{x^2 ${sgn(b)}x ${sgn(c)}}{x ${sgn(-r)}}.`,a,tol:0.001,hint:`Fatore o numerador e cancele (x ${sgn(-r)}).`,sol:`(x ${sgn(-r)})(x ${sgn(-s)}) / (x ${sgn(-r)}) → x ${sgn(-s)} → ${a}.`,gen:true}; }
function genDer(){ const a=rnz(1,4), n=ri(2,4), k=ri(1,4); const coef=a*n; const val=coef*Math.pow(k,n-1);
  return {d:2,type:'num',q:`Sendo f(x)=${a}x^{${n}}, calcule f'(${k}).`,a:val,tol:0.001,hint:`Regra da potência: f'(x)=${a}·${n}x^{${n-1}}.`,sol:`f'(x)=${coef}x^{${n-1}} ⇒ f'(${k})=${val}.`,gen:true}; }
function genInt(){ const a=rnz(1,4), n=ri(1,3), p=ri(0,2), q=p+ri(1,2); const F=(t)=>a*Math.pow(t,n+1)/(n+1); const val=F(q)-F(p);
  return {d:3,type:'num',q:`Calcule \\int_{${p}}^{${q}} ${a}x^{${n}}\\,dx. (decimal, 2 casas)`,a:Math.round(val*100)/100,tol:0.05,hint:`Antiderivada: \\frac{${a}x^{${n+1}}}{${n+1}}.`,sol:`F(x)=${a}x^{${n+1}}/${n+1}; F(${q})-F(${p}) ≈ ${val.toFixed(2)}.`,gen:true}; }

    pool:[
      mc(1,'Quanto é \\frac{1}{4}+\\frac{1}{2}?',['\\frac{2}{6}','\\frac{3}{4}','\\frac{1}{6}','\\frac{2}{3}'],1,'Deixe as duas com denominador 4.','1/4 + 2/4 = 3/4.'),

    pool:[
      nu(1,'Resolva 3x-9=0. x = ?',3,0.001,'Passe o 9 e divida por 3.','3x=9 ⇒ x=3.'),

const LEVEL_LABEL = { fund:'Fundamental (revisão)', med:'Ensino Médio (lacunas)', sup:'Cálculo (foco)' };

/* seleção de questão */
function pickIdx(pool, d, used){ const avail=pool.map((q,i)=>i).filter(i=>used.indexOf(i)<0); if(!avail.length) return null; avail.sort((a,b)=>Math.abs(pool[a].d-d)-Math.abs(pool[b].d-d)); return avail[0]; }
function pickDiagItem(skill, d){ const same=skill.pool.filter(q=>q.d===d); const mcq=same.find(q=>q.type==='mc'||q.type==='tf'); return mcq || skill.pool[pickIdx(skill.pool,d,[])]; }
// próxima questão para prática/aula: usa gerador quando o pool não basta
function nextExercise(skill, used, diff, preferGen){
  if(preferGen && skill.gen && skill.gen.length && Math.random()<0.65) return pick(skill.gen)();
  const idx=pickIdx(skill.pool, diff, used);
  if(idx==null){ if(skill.gen && skill.gen.length) return pick(skill.gen)(); return {__idx:pickIdx(skill.pool,diff,[]), recycle:true}; }
  return {__idx:idx};
}

/* ============================ ESTADO ============================ */
const STORE_KEY = 'trilha_calculo_v3';
const defaultState = () => ({ user:{ name:'', xp:0, streak:0, lastActive:0, diagnosticDone:false, simDays:0 }, skills:{}, reviews:[], log:[] });
function loadState(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultState(); } catch(e){ return defaultState(); } }
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

const LEVELS = [ {min:0,name:'Iniciante',emoji:'🌱'},{min:80,name:'Aprendiz',emoji:'📗'},{min:200,name:'Explorador',emoji:'🧭'},{min:400,name:'Calculista',emoji:'📐'},{min:700,name:'Analista',emoji:'🧠'},{min:1100,name:'Mestre',emoji:'🏆'} ];
const levelOf = (xp)=>{ let L=LEVELS[0]; for(const l of LEVELS) if(xp>=l.min) L=l; return L; };
const nextLevel = (xp)=> LEVELS.find(l=>l.min>xp) || null;
const REVIEW_STAGES = [0, 7, 30];

function useApp(){
  const [state, setState] = useState(loadState);
  useEffect(()=>saveState(state), [state]);
  const now = ()=> todayKey(state.user.simDays);
  const bumpStreak = (s)=>{ const t=todayKey(s.user.simDays); const last=s.user.lastActive; if(last===t) return s.user.streak; if(last===t-DAY) return s.user.streak+1; return 1; };

  const addXp = useCallback((amount, note)=>{ setState(s=>{ const streak=bumpStreak(s); const t=todayKey(s.user.simDays); return {...s, user:{...s.user, xp:s.user.xp+amount, streak, lastActive:t}, log:[{ts:Date.now(),note,xp:amount},...s.log].slice(0,50)}; }); },[]);
  const scheduleReviews = (s, skillId)=>{ const t=todayKey(s.user.simDays); const others=s.reviews.filter(r=>r.skillId!==skillId); const news=REVIEW_STAGES.map((d,i)=>({skillId,due:t+d*DAY,stage:i})); return [...others,...news]; };

  const masterSkill = useCallback((skillId, score, lvl)=>{ setState(s=>{ const skills={...s.skills,[skillId]:{status:'mastered',best:Math.max(score,s.skills[skillId]?.best||0),lvl:lvl||s.skills[skillId]?.lvl||1}}; const idx=CURR.findIndex(x=>x.id===skillId); const next=CURR[idx+1]; if(next && (!skills[next.id]||skills[next.id].status==='locked')) skills[next.id]={status:'available',best:0,lvl:1}; const reviews=scheduleReviews(s,skillId); return {...s,skills,reviews}; }); },[]);
  const completeReview = useCallback((skillId)=>{ setState(s=>{ const t=todayKey(s.user.simDays); const due=s.reviews.filter(r=>r.skillId===skillId && r.due<=t).sort((a,b)=>a.stage-b.stage); let reviews=s.reviews; if(due[0]) reviews=s.reviews.filter(r=>r!==due[0]); return {...s,reviews}; }); },[]);

  const applyDiagnostic = useCallback((results)=>{ setState(s=>{ const skills={}; let reviews=[...s.reviews]; const t=todayKey(s.user.simDays);
    CURR.forEach(sk=>{ skills[sk.id]={status:'locked',best:0,lvl:1}; });
    Object.entries(results).forEach(([id,r])=>{ if(r.ok && skills[id]){ const score=r.d>=3?100:r.d>=2?85:70; skills[id]={status:'mastered',best:score,lvl:r.d}; REVIEW_STAGES.forEach((d,i)=>reviews.push({skillId:id,due:t+d*DAY,stage:i})); } });
    const firstOpen=CURR.find(sk=>skills[sk.id].status!=='mastered'); if(firstOpen) skills[firstOpen.id]={...skills[firstOpen.id],status:'available'};
    return {...s,skills,reviews,user:{...s.user,diagnosticDone:true}}; }); },[]);

  const setName = useCallback((name)=>setState(s=>({...s,user:{...s.user,name}})),[]);
  const timeTravel = useCallback((days)=>setState(s=>({...s,user:{...s.user,simDays:s.user.simDays+days}})),[]);
  const reset = useCallback(()=>{ localStorage.removeItem(STORE_KEY); setState(defaultState()); },[]);
  const dueReviews = useMemo(()=>{ const t=now(); const seen=new Set(); return state.reviews.filter(r=>r.due<=t).filter(r=>{ if(seen.has(r.skillId))return false; seen.add(r.skillId); return true; }); },[state.reviews,state.user.simDays]);

  return { state, now, addXp, masterSkill, completeReview, applyDiagnostic, setName, timeTravel, reset, dueReviews };
}

/* ============================ UI base ============================ */
function Bar({value, className=''}){ return <div className={"h-2 rounded-full bg-slate-200 overflow-hidden "+className}><div className="h-full bg-teal-500 transition-all duration-500" style={{width:clamp(value,0,100)+'%'}}/></div>; }
function DiffChip({d}){ const x=DIFF[d]; return <span className={"text-xs px-2 py-0.5 rounded-full border font-semibold "+x.cls}>{x.emo} {x.n}</span>; }

function TopBar({app}){ const {user}=app.state; const lvl=levelOf(user.xp); const nxt=nextLevel(user.xp); const prog=nxt?((user.xp-lvl.min)/(nxt.min-lvl.min))*100:100;
  return (<div className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200"><div className="max-w-xl mx-auto px-4 py-2 flex items-center gap-3">

  </div></div>); }

/* ============================ Exercício (mc, num, tf, err, order) ============================ */
function Exercise({item, mode, adaptive, onDone}){
  // normaliza tf e err para o caminho de múltipla escolha
  let type=item.type, options=item.options, correct=item.a, prompt=item.q;
  if(type==='tf'){ options=['✅ Verdadeiro','❌ Falso']; correct=item.a?0:1; type='mc'; }
  if(type==='err'){ options=item.steps; correct=item.a; type='mc'; }

  const [sel,setSel]=useState(null); const [numVal,setNumVal]=useState('');
  const [orderPick,setOrderPick]=useState([]);
  const shuffled = useMemo(()=> item.type==='order'? shuffle(item.steps.map((s,i)=>({s,i}))) : null, [item]);
  const [phase,setPhase]=useState('idle'); const [ok,setOk]=useState(false);
  const [showHint,setShowHint]=useState(false); const [showSol,setShowSol]=useState(false);
  const isDiag = mode==='diag';

  const canCheck = type==='mc' ? sel!=null : item.type==='num' ? numVal.trim()!=='' : item.type==='order' ? orderPick.length===item.steps.length : false;

  const check=()=>{
    let c=false;
    if(type==='mc') c = sel===correct;
    else if(item.type==='num'){ const v=parseFloat(String(numVal).replace(',','.')); c=!isNaN(v)&&Math.abs(v-item.a)<=(item.tol||0.001); }
    else if(item.type==='order'){ c = orderPick.every((p,i)=> shuffled[p].i===i); }
    setOk(c); setPhase('result'); if(!c && adaptive) setShowHint(true);
  };
  const retry=()=>{ setPhase('idle'); setSel(null); setNumVal(''); setOrderPick([]); setShowSol(false); };
  const toggleOrder=(pi)=>{ setOrderPick(prev=> prev.includes(pi)? prev.filter(x=>x!==pi) : [...prev,pi]); };

  const typeBadge = { tf:'Verdadeiro ou Falso', err:'Ache o erro', order:'Ordene os passos' }[item.type];

  return (<div className="fade-in">
    <div className="flex flex-wrap gap-2 mb-2">
      {item.src && <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200 font-medium">{item.src==='Stewart'?'📘':'📗'} {item.src}</span>}
      {typeBadge && <span className="text-[11px] px-2 py-0.5 rounded-full bg-purple-50 text-purple-600 border border-purple-200 font-medium">🧠 {typeBadge}</span>}
      {item.gen && <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200 font-medium">♾️ gerado</span>}
    </div>
    <div className="text-slate-800 text-lg mb-4 leading-relaxed"><M tex={prompt} block/></div>
    {item.type==='err' && <p className="text-sm text-slate-500 -mt-2 mb-3">Toque no passo que contém o erro:</p>}

    {type==='mc' ? (
      <div className="grid gap-2">{options.map((opt,i)=>{ const chosen=sel===i; const right=phase==='result'&&i===correct; const wrong=phase==='result'&&chosen&&i!==correct;
        return <button key={i} disabled={phase==='result'} onClick={()=>phase!=='result'&&setSel(i)}
          className={"text-left px-4 py-3 rounded-xl border-2 transition min-h-[52px] "+(right?'border-teal-500 bg-teal-50':wrong?'border-red-400 bg-red-50 shake':chosen?'border-teal-500 bg-teal-50':'border-slate-200 bg-white active:scale-[.99]')}>
          {item.type==='err' && <span className="text-slate-400 mr-2">{i+1}.</span>}{hasTex(opt)?<M tex={opt}/>:<span>{opt}</span>}</button>; })}</div>
    ) : item.type==='num' ? (
      <input type="text" inputMode="decimal" value={numVal} disabled={phase==='result'} onChange={e=>setNumVal(e.target.value)} placeholder="Digite sua resposta"
        className={"w-full px-4 py-3 rounded-xl border-2 text-lg outline-none "+(phase==='result'?(ok?'border-teal-500 bg-teal-50':'border-red-400 bg-red-50 shake'):'border-slate-200 focus:border-teal-400')}/>
    ) : ( /* order */
      <div>
        <div className="grid gap-2 mb-3">{shuffled.map((o,pi)=>{ const pos=orderPick.indexOf(pi); const chosen=pos>=0;
          return <button key={pi} disabled={phase==='result'} onClick={()=>phase!=='idle'?null:toggleOrder(pi)}
            className={"flex items-center gap-2 text-left px-4 py-3 rounded-xl border-2 min-h-[52px] "+(chosen?'border-teal-500 bg-teal-50':'border-slate-200 bg-white active:scale-[.99]')}>
            <span className={"w-6 h-6 shrink-0 rounded-full grid place-items-center text-xs font-bold "+(chosen?'bg-teal-500 text-white':'bg-slate-100 text-slate-400')}>{chosen?pos+1:''}</span>
            {hasTex(o.s)?<M tex={o.s}/>:<span>{o.s}</span>}</button>; })}</div>
      </div>
    )}

    {phase==='result' && ok && <div className="mt-3 text-teal-700 font-semibold pop">✅ Isso aí!</div>}
    {phase==='result' && !ok && <div className="mt-3 text-sm text-red-600">{isDiag?'Sem problema — isso entra na sua trilha.':'Não foi dessa vez. 💪'}</div>}
    {phase==='result' && item.type==='order' && <div className="mt-2 text-sm text-slate-600">Ordem correta: {item.steps.map((s,i)=><span key={i} className="inline-block mr-2">{i+1}) <T s={s}/></span>)}</div>}

    {(showHint || (phase==='result' && !ok && item.hint)) && item.hint && <div className="mt-3 text-sm bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-800">💡 <b>Dica:</b> {item.hint}</div>}
    {phase==='result' && (ok||showSol) && item.sol && <div className="mt-3 text-sm bg-slate-50 rounded-lg p-3 text-slate-700"><b>Solução:</b> <T s={item.sol}/></div>}

    <div className="mt-4 flex gap-2">
      {phase==='idle' && <button onClick={check} disabled={!canCheck} className="flex-1 bg-teal-600 disabled:opacity-40 text-white font-semibold py-3 rounded-xl active:scale-[.98]">Verificar</button>}
      {phase==='result' && ok && <button onClick={()=>onDone(true)} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl active:scale-[.98]">Continuar →</button>}
      {phase==='result' && !ok && isDiag && <button onClick={()=>onDone(false)} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl">Continuar →</button>}
      {phase==='result' && !ok && !isDiag && !showSol && <>
        {!showHint && item.hint && <button onClick={()=>setShowHint(true)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-600">Dica</button>}
        <button onClick={retry} className="flex-1 bg-teal-600 text-white font-semibold py-3 rounded-xl">Tentar de novo</button>
        {item.sol && <button onClick={()=>setShowSol(true)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-500 text-sm">Solução</button>}
        {!item.sol && <button onClick={()=>onDone(false)} className="px-4 py-3 rounded-xl border border-slate-300 text-slate-500 text-sm">Pular</button>}
      </>}
      {phase==='result' && !ok && !isDiag && showSol && <button onClick={()=>onDone(false)} className="flex-1 bg-slate-600 text-white font-semibold py-3 rounded-xl">Continuar →</button>}
    </div>
  </div>);
}

/* ============================ Flashcards ============================ */
function Flashcards({skill, onDone}){
  const cards = skill.cards||[];
  const [i,setI]=useState(0); const [flip,setFlip]=useState(false); const [known,setKnown]=useState(0);
  if(!cards.length) return <p className="text-sm text-slate-400 p-4">Sem cartões neste tópico.</p>;
  if(i>=cards.length) return (<div className="text-center p-6 fade-in"><div className="text-4xl">🃏</div><p className="font-semibold text-slate-800 mt-2">Fim dos cartões!</p><p className="text-sm text-slate-500">Você marcou saber {known} de {cards.length}.</p><button onClick={()=>{setI(0);setKnown(0);setFlip(false);}} className="mt-4 bg-teal-600 text-white font-semibold px-5 py-2.5 rounded-xl">Revisar de novo</button></div>);
  const c=cards[i]; const rate=(good)=>{ if(good) setKnown(k=>k+1); setFlip(false); setI(i+1); };
  return (<div className="fade-in">
    <div className="flex justify-between text-xs text-slate-500 mb-2"><span>Cartão {i+1}/{cards.length}</span><span>toque para virar</span></div>
    <div className={"flip "+(flip?'flipped':'')} onClick={()=>setFlip(f=>!f)} style={{minHeight:180}}>
      <div className="flip-inner" style={{minHeight:180}}>
        <div className="flip-face bg-white border-2 border-teal-200 rounded-2xl grid place-items-center p-6 text-center" style={{minHeight:180}}>
          <div><div className="text-[11px] uppercase tracking-wide text-teal-500 mb-2">Frente</div><div className="text-xl text-slate-800">{hasTex(c[0])?<M tex={c[0]} block/>:c[0]}</div></div>
        </div>
        <div className="flip-face flip-back bg-teal-600 text-white rounded-2xl grid place-items-center p-6 text-center" style={{minHeight:180}}>
          <div><div className="text-[11px] uppercase tracking-wide text-teal-100 mb-2">Verso</div><div className="text-xl">{hasTex(c[1])?<M tex={c[1]} block/>:c[1]}</div></div>
        </div>
      </div>

      : (<button onClick={()=>setFlip(true)} className="w-full mt-4 bg-teal-600 text-white font-semibold py-3 rounded-xl">Ver resposta</button>)}
  </div>);
}

/* ============================ Motor adaptativo (aula/revisão) ============================ */
function AdaptiveExercises({skill, startDiff, target, escalate, reviewMode, onCorrect, onFinish}){
  const [diff,setDiff]=useState(startDiff||1);
  const [used,setUsed]=useState([]);
  const [item,setItem]=useState(()=>{ const n=nextExercise(skill,[],startDiff||1,false); return n.__idx!=null? skill.pool[n.__idx] : n; });
  const [curIdx,setCurIdx]=useState(()=>{ const n=nextExercise(skill,[],startDiff||1,false); return n.__idx!=null?n.__idx:-1; });
  const [correctCount,setCorrectCount]=useState(0); const [bestDiff,setBestDiff]=useState(0);
  const [cStreak,setCStreak]=useState(0); const [wStreak,setWStreak]=useState(0); const [flash,setFlash]=useState(null); const [tick,setTick]=useState(0);
  const needed=Math.min(target, skill.pool.length + (skill.gen?2:0));
  const register = (wStreak>=1 || diff===1) ? 'simples' : (diff===3 ? 'desafio' : 'padrao');

  const handle=(correct)=>{
    let nUsed = curIdx>=0 ? [...used,curIdx] : used;
    let nCorrect=correctCount, nBest=bestDiff, nC=cStreak, nW=wStreak, nDiff=diff, fl=null;
    if(correct){ onCorrect(); nCorrect++; nBest=Math.max(nBest,item.d||diff); nC++; nW=0; if(escalate && nC>=2 && nDiff<3){ nDiff++; nC=0; fl='up'; } }
    else { nW++; nC=0; if(nDiff>1){ nDiff--; if(escalate) fl='down'; } }
    if(nCorrect>=needed){ onFinish(nBest||1); return; }
    const n=nextExercise(skill, nUsed, nDiff, false);
    let nextItem, nextIdx;
    if(n.__idx!=null){ nextIdx=n.__idx; nextItem=skill.pool[n.__idx]; } else { nextIdx=-1; nextItem=n; }
    setUsed(nUsed); setCorrectCount(nCorrect); setBestDiff(nBest); setCStreak(nC); setWStreak(nW); setDiff(nDiff); setItem(nextItem); setCurIdx(nextIdx); setFlash(fl); setTick(t=>t+1);
    if(fl) setTimeout(()=>setFlash(null),1400);
  };

  return (<div>
    <div className="flex justify-between items-center text-xs text-slate-500 mb-2"><span>{reviewMode?'Revisão':'Progresso'}: {correctCount}/{needed} ✓</span><DiffChip d={item.d||diff}/></div>
    <Bar value={(correctCount/needed)*100} className="mb-3"/>
    {flash==='up' && <div className="mb-3 text-sm bg-red-50 border border-red-200 text-red-700 rounded-lg p-2.5 pop">🔥 Mandou bem! Subindo a dificuldade.</div>}
    {flash==='down' && <div className="mb-3 text-sm bg-green-50 border border-green-200 text-green-700 rounded-lg p-2.5">🧩 Vamos com calma — voltando um nível.</div>}
    {register==='simples' && !flash && <div className="mb-3 text-xs text-teal-700 bg-teal-50 rounded-lg p-2.5">🧩 Modo passo a passo: leia a dica e vá com calma.</div>}
    {register==='desafio' && !flash && <div className="mb-3 text-xs text-red-700 bg-red-50 rounded-lg p-2.5">🔥 Modo desafio ativado!</div>}
    <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
      <Exercise key={tick} mode="lesson" adaptive={register==='simples'} item={item} onDone={handle}/>
    </div>
  </div>);
}

/* ============================ Telas ============================ */
function Onboarding({app}){ const [name,setName]=useState('');
  return (<div className="max-w-xl mx-auto px-5 pt-10 pb-24 text-center fade-in">
    <div className="text-6xl mb-4">📐</div><h1 className="text-2xl font-bold text-slate-800">Trilha de Cálculo</h1>
    <p className="text-slate-500 mt-2 mb-8">Do fundamental ao Cálculo I. Diagnóstico adaptativo, trilha sob medida, exercícios infinitos, flashcards e revisões inteligentes.</p>
    <input value={name} onChange={e=>setName(e.target.value)} placeholder="Como podemos te chamar?" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-teal-400 outline-none text-center mb-3"/>
    <button disabled={!name.trim()} onClick={()=>app.setName(name.trim())} className="w-full bg-teal-600 disabled:opacity-40 text-white font-semibold py-3.5 rounded-xl active:scale-[.98]">Começar</button>
    <p className="text-xs text-slate-400 mt-6">Seu progresso fica salvo só neste aparelho.</p></div>); }

function Diagnostic({app}){
  const [st,setSt]=useState(()=>({ i:0, curDiff:2, bandStreak:0, results:{} }));
  const skill=CURR[st.i]; const item=pickDiagItem(skill, st.curDiff);
  const answer=(correct)=>{
    const results={...st.results,[skill.id]:{ok:correct,d:st.curDiff}};
    let bandStreak=correct?st.bandStreak+1:0; let curDiff=correct?Math.min(3,st.curDiff+1):Math.max(1,st.curDiff-1);
    let next=st.i+1; const band=skill.level;
    if(band!=='sup' && bandStreak>=2){ while(next<CURR.length && CURR[next].level===band){ results[CURR[next].id]={ok:true,d:st.curDiff,skip:true}; next++; } }
    if(next>=CURR.length){ app.applyDiagnostic(results); return; }
    if(CURR[next].level!==band){ curDiff=2; bandStreak=0; }
    setSt({i:next,curDiff,bandStreak,results});
  };
  const answered=Object.keys(st.results).length;
  return (<div className="max-w-xl mx-auto px-5 pt-6 pb-24">
    <div className="mb-4"><div className="flex justify-between text-xs text-slate-500 mb-1"><span>Teste de nível adaptativo</span><span>{answered} respondidas</span></div><Bar value={(st.i/CURR.length)*100}/></div>
    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
      <div className="flex items-center justify-between mb-3"><p className="text-xs uppercase tracking-wide text-teal-600 font-semibold">{LEVEL_LABEL[skill.level]}</p><DiffChip d={st.curDiff}/></div>
      <Exercise key={st.i} mode="diag" adaptive={false} item={{...item, hint:item.hint||'Se não lembrar, tudo bem — entra na sua trilha.'}} onDone={answer}/>
    </div>
    <p className="text-center text-xs text-slate-400 mt-4">A dificuldade sobe quando você acerta e desce quando erra. Acertos você pula (voltam em revisão).</p>
  </div>);
}

function SkillCard({skill, st, onOpen}){ const locked=!st||st.status==='locked'; const mastered=st?.status==='mastered';
  return (<button disabled={locked} onClick={onOpen} className={"w-full flex items-center gap-3 p-3.5 rounded-2xl border text-left transition min-h-[64px] "+(locked?'bg-slate-50 border-slate-100 opacity-60':mastered?'bg-teal-50 border-teal-200 active:scale-[.99]':'bg-white border-slate-200 shadow-sm active:scale-[.99]')}>
    <div className={"w-11 h-11 shrink-0 rounded-xl grid place-items-center text-xl "+(mastered?'bg-teal-500 text-white':locked?'bg-slate-200':'bg-teal-100')}>{locked?'🔒':mastered?'✓':skill.icon}</div>
    <div className="flex-1 min-w-0"><div className="font-semibold text-slate-800 text-[15px] truncate">{skill.title}</div><div className="text-xs text-slate-500">{skill.method}</div></div>
    {mastered && <span className="text-xs text-teal-600 font-semibold">Dominado</span>}
    {st?.status==='available' && <span className="text-xs text-teal-600 font-semibold">Começar →</span>}</button>); }

function Trilha({app, openSkill}){ const {skills}=app.state; const byMod=MODULES.map(m=>({mod:m,items:CURR.filter(s=>s.mod===m)})); const total=CURR.length; const done=Object.values(skills).filter(x=>x.status==='mastered').length;
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28">
    <div className="bg-gradient-to-br from-teal-600 to-teal-500 text-white rounded-2xl p-5 mb-5"><div className="text-sm opacity-90">Progresso da trilha</div><div className="text-3xl font-bold my-1">{done}/{total}</div><Bar value={(done/total)*100} className="bg-teal-700/40 mt-2"/><div className="text-xs opacity-90 mt-2">Meta: dominar Limite, Derivada e Integral 🎯</div></div>
    {byMod.map(({mod,items})=>(<div key={mod} className="mb-6"><h3 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2 px-1">{mod}</h3><div className="grid gap-2">{items.map(s=><SkillCard key={s.id} skill={s} st={skills[s.id]} onOpen={()=>openSkill(s.id)}/>)}</div></div>))}
  </div>); }

function Lesson({app, skillId, onDone, reviewMode}){
  const skill=CURR.find(s=>s.id===skillId); const [tab,setTab]=useState(reviewMode?'ex':'learn');
  const skState=app.state.skills[skillId];
  const startDiff = reviewMode ? (skState?.lvl||2) : (skState?.status==='mastered' ? (skState?.lvl||1) : 1);
  const onCorrect=()=>app.addXp(reviewMode?15:10, (reviewMode?'Revisão: ':'Exercício: ')+skill.title);
  const finish=(bestDiff)=>{ if(reviewMode){ app.completeReview(skillId); } else { const score=bestDiff>=3?100:bestDiff>=2?85:70; app.masterSkill(skillId,score,bestDiff); } onDone(true); };
  const TB=({id,label})=>(<button onClick={()=>setTab(id)} className={"flex-1 py-2 rounded-lg text-sm font-medium "+(tab===id?'bg-white shadow-sm text-teal-700':'text-slate-500')}>{label}</button>);

  return (<div className="max-w-xl mx-auto px-4 pt-3 pb-28">
    <button onClick={()=>onDone(false)} className="text-slate-500 text-sm mb-2">← Voltar</button>
    <div className="flex items-center gap-2 mb-1"><span className="text-2xl">{skill.icon}</span><h2 className="text-xl font-bold text-slate-800">{skill.title}</h2></div>
    <p className="text-xs text-slate-500 mb-4">{reviewMode?'🔁 Revisão espaçada — reforce o que já aprendeu':'Metodologia: '+skill.method}</p>

    {!reviewMode && (<div className="flex gap-1.5 mb-4 bg-slate-100 p-1 rounded-xl"><TB id="learn" label="📖 Aprender"/><TB id="cards" label="🃏 Cartões"/><TB id="ex" label="✏️ Exercícios"/></div>)}

    {tab==='learn' ? (<div className="fade-in">
      <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">{skill.theory.map((b,i)=>{
        if(b.t==='p') return <p key={i} className="text-slate-700 leading-relaxed mb-3">{b.c}</p>;
        if(b.t==='f') return <div key={i} className="bg-slate-50 rounded-lg py-2 px-3 mb-3"><M tex={b.c} block/></div>;
        if(b.t==='tip') return <div key={i} className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3 text-amber-800 text-sm">💡 {b.c}</div>;
        if(b.t==='met') return <div key={i} className="text-xs text-teal-700 bg-teal-50 rounded-lg p-2.5 mb-3">🎓 {b.c}</div>;
        if(b.t==='err') return <div key={i} className="bg-red-50 border border-red-200 rounded-lg p-3 mb-3 text-red-700 text-sm">⚠️ {b.c}</div>;
        if(b.t==='why') return <div key={i} className="bg-indigo-50 border border-indigo-200 rounded-lg p-3 mb-3 text-indigo-700 text-sm">🎯 <b>Por que importa:</b> {b.c}</div>;
        return null; })}</div>
      {skill.examples?.length>0 && (<div className="mt-4"><h4 className="text-sm font-bold text-slate-600 mb-2 px-1">Exemplo guiado (revele passo a passo)</h4>{skill.examples.map((ex,i)=><div key={i} className="mb-2"><GuidedExample ex={ex}/></div>)}</div>)}
      <a href={"https://www.symbolab.com/solver/step-by-step/"+encodeURIComponent(skill.title)} target="_blank" rel="noopener" className="block text-center text-sm text-teal-600 mt-4 underline">🔎 Ver mais exemplos no Symbolab</a>
      <button onClick={()=>setTab('cards')} className="w-full mt-4 border-2 border-teal-200 text-teal-700 font-semibold py-3 rounded-xl">🃏 Revisar cartões</button>
      <button onClick={()=>setTab('ex')} className="w-full mt-2 bg-teal-600 text-white font-semibold py-3.5 rounded-xl active:scale-[.98]">Praticar exercícios →</button>
    </div>) : tab==='cards' ? (
      <div className="fade-in"><Flashcards skill={skill}/><button onClick={()=>setTab('ex')} className="w-full mt-4 bg-teal-600 text-white font-semibold py-3.5 rounded-xl">Ir para exercícios →</button></div>
    ) : (
      <AdaptiveExercises skill={skill} startDiff={startDiff} target={reviewMode?2:3} escalate={!reviewMode} reviewMode={reviewMode} onCorrect={onCorrect} onFinish={finish}/>
    )}
  </div>); }

/* ============================ Praticar (treino livre) ============================ */
function PracticeSession({app, skill, onExit}){
  // skill pode ser um objeto skill ou null (mistão)
  const unlocked = CURR.filter(s=> ['available','mastered'].includes(app.state.skills[s.id]?.status));
  const chooseSkill = ()=> skill || pick(unlocked);
  const build=()=>{ const s=chooseSkill(); const n=nextExercise(s, [], ri(1,3), true); const it=n.__idx!=null? s.pool[n.__idx] : n; return {s, it}; };
  const [cur,setCur]=useState(build); const [count,setCount]=useState(0); const [hits,setHits]=useState(0); const [tick,setTick]=useState(0);
  const handle=(ok)=>{ if(ok){ app.addXp(5,'Prática: '+cur.s.title); setHits(h=>h+1); } setCount(c=>c+1); setCur(build()); setTick(t=>t+1); };
  return (<div className="max-w-xl mx-auto px-4 pt-3 pb-28">
    <button onClick={onExit} className="text-slate-500 text-sm mb-2">← Sair da prática</button>
    <div className="flex items-center justify-between mb-3"><div><div className="font-bold text-slate-800">{skill?skill.title:'Mistão 🎲'}</div><div className="text-xs text-slate-500">Treino livre — infinito, sem pressão</div></div>
      <div className="text-right"><div className="text-lg font-bold text-teal-600">{hits}/{count}</div><div className="text-[11px] text-slate-400">acertos</div></div></div>
    {!skill && <div className="text-xs text-purple-600 bg-purple-50 rounded-lg p-2 mb-3">Tópico atual: {cur.s.title}</div>}
    <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><Exercise key={tick} mode="practice" adaptive={false} item={cur.it} onDone={handle}/></div>
  </div>);
}
function Practice({app}){
  const [sel,setSel]=useState(undefined); // undefined=menu, null=mistão, skill=obj
  const unlocked = CURR.filter(s=> ['available','mastered'].includes(app.state.skills[s.id]?.status));
  if(sel!==undefined) return <PracticeSession app={app} skill={sel} onExit={()=>setSel(undefined)}/>;
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28">
    <h1 className="text-2xl font-bold text-slate-800 mb-1">Praticar 💪</h1>
    <p className="text-slate-500 text-sm mb-5">Treino livre e ilimitado. Sem travar avanço — só repetição pra fixar.</p>
    {unlocked.length===0 ? <p className="text-sm text-slate-400">Desbloqueie tópicos na trilha para praticar.</p> : (<>
      <button onClick={()=>setSel(null)} className="w-full bg-gradient-to-br from-purple-600 to-purple-500 text-white rounded-2xl p-5 text-left active:scale-[.99] mb-4">
        <div className="text-2xl">🎲</div><div className="text-lg font-bold">Mistão</div><div className="text-sm opacity-90">Questões sorteadas de todos os tópicos liberados</div></button>
      <h3 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2 px-1">Por tópico</h3>
      <div className="grid gap-2">{unlocked.map(s=>(<button key={s.id} onClick={()=>setSel(s)} className="w-full flex items-center gap-3 p-3.5 rounded-2xl bg-white border border-slate-200 shadow-sm text-left active:scale-[.99]">
        <div className="w-10 h-10 rounded-xl bg-teal-100 grid place-items-center text-lg">{s.icon}</div>
        <div className="flex-1"><div className="font-semibold text-slate-800 text-sm">{s.title}</div><div className="text-xs text-slate-500">{s.gen?'♾️ exercícios infinitos':'banco de exercícios'}</div></div>→</button>))}</div>
    </>)}
  </div>);
}

function Home({app, openSkill, startReview, goTrilha, goPractice}){ const {user}=app.state; const due=app.dueReviews; const nextSkill=CURR.find(s=>app.state.skills[s.id]?.status==='available'); const hour=new Date().getHours(); const greet=hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28">
    <div className="mb-5"><p className="text-slate-500 text-sm">{greet},</p><h1 className="text-2xl font-bold text-slate-800">{user.name} 👋</h1></div>
    <div className="grid grid-cols-2 gap-3 mb-5">
      <div className="bg-white rounded-2xl p-4 border border-slate-100 text-center"><div className="text-3xl">🔥</div><div className="text-2xl font-bold text-slate-800">{user.streak}</div><div className="text-xs text-slate-500">dias seguidos</div></div>
      <div className="bg-white rounded-2xl p-4 border border-slate-100 text-center"><div className="text-3xl">{levelOf(user.xp).emoji}</div><div className="text-lg font-bold text-slate-800">{levelOf(user.xp).name}</div><div className="text-xs text-slate-500">{user.xp} XP</div></div></div>
    {due.length>0 && (<div className="mb-5"><h3 className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">🔁 Revisões de hoje <span className="bg-orange-100 text-orange-600 text-xs px-2 py-0.5 rounded-full">{due.length}</span></h3><div className="grid gap-2">{due.map(r=>{ const sk=CURR.find(s=>s.id===r.skillId); const label=r.stage===0?'no mesmo dia':r.stage===1?'1 semana depois':'1 mês depois';
      return (<button key={r.skillId} onClick={()=>startReview(r.skillId)} className="w-full flex items-center gap-3 p-3.5 rounded-2xl bg-orange-50 border border-orange-200 text-left active:scale-[.99]"><div className="w-10 h-10 rounded-xl bg-orange-100 grid place-items-center text-lg">{sk.icon}</div><div className="flex-1"><div className="font-semibold text-slate-800 text-sm">{sk.title}</div><div className="text-xs text-orange-600">Revisão {label}</div></div><span className="text-orange-500 text-sm font-semibold">+15 XP</span></button>); })}</div></div>)}
    <h3 className="text-sm font-bold text-slate-700 mb-2">Continuar aprendendo</h3>
    {nextSkill ? (<button onClick={()=>openSkill(nextSkill.id)} className="w-full bg-gradient-to-br from-teal-600 to-teal-500 text-white rounded-2xl p-5 text-left active:scale-[.99]"><div className="text-xs opacity-90 mb-1">{nextSkill.mod}</div><div className="flex items-center gap-2"><span className="text-2xl">{nextSkill.icon}</span><span className="text-lg font-bold">{nextSkill.title}</span></div><div className="mt-3 inline-block bg-white/20 rounded-lg px-3 py-1.5 text-sm font-semibold">Iniciar aula →</div></button>) : (<div className="bg-teal-50 border border-teal-200 rounded-2xl p-5 text-center"><div className="text-3xl mb-1">🏆</div><p className="font-semibold text-teal-800">Você concluiu toda a trilha!</p><p className="text-sm text-teal-600 mt-1">Continue nas revisões e na prática.</p></div>)}
    <div className="grid grid-cols-2 gap-2 mt-3">
      <button onClick={goPractice} className="text-purple-600 font-medium text-sm py-2.5 rounded-xl border border-purple-200 bg-purple-50">💪 Praticar</button>
      <button onClick={goTrilha} className="text-teal-600 font-medium text-sm py-2.5 rounded-xl border border-teal-200 bg-teal-50">🗺️ Ver trilha</button>
    </div>
  </div>); }

function Profile({app}){ const {user}=app.state; const done=Object.values(app.state.skills).filter(x=>x.status==='mastered').length; const upcoming=[...app.state.reviews].sort((a,b)=>a.due-b.due).slice(0,6);
  return (<div className="max-w-xl mx-auto px-4 pt-4 pb-28">
    <div className="text-center mb-6"><div className="text-5xl">{levelOf(user.xp).emoji}</div><h2 className="text-xl font-bold text-slate-800 mt-1">{user.name}</h2><p className="text-slate-500 text-sm">{levelOf(user.xp).name} · {user.xp} XP</p></div>
    <div className="grid grid-cols-3 gap-3 mb-6 text-center"><div className="bg-white rounded-xl p-3 border border-slate-100"><div className="text-xl font-bold">🔥{user.streak}</div><div className="text-xs text-slate-500">streak</div></div><div className="bg-white rounded-xl p-3 border border-slate-100"><div className="text-xl font-bold">{done}</div><div className="text-xs text-slate-500">dominados</div></div><div className="bg-white rounded-xl p-3 border border-slate-100"><div className="text-xl font-bold">{app.state.reviews.length}</div><div className="text-xs text-slate-500">revisões</div></div></div>
    <h3 className="text-sm font-bold text-slate-700 mb-2">🗓️ Próximas revisões</h3>
    <div className="grid gap-2 mb-6">{upcoming.length===0 && <p className="text-sm text-slate-400">Nenhuma revisão agendada ainda.</p>}{upcoming.map((r,i)=>{const sk=CURR.find(s=>s.id===r.skillId); const t=app.now(); return <div key={i} className="flex items-center gap-2 bg-white rounded-xl p-3 border border-slate-100 text-sm"><span>{sk.icon}</span><span className="flex-1">{sk.title}</span><span className={r.due<=t?'text-orange-600 font-semibold':'text-slate-400'}>{r.due<=t?'hoje':fmtDate(r.due)}</span></div>;})}</div>
    <div className="bg-slate-100 rounded-xl p-4"><p className="text-xs text-slate-500 mb-2">🧪 Demonstração — avance o tempo para ver as revisões espaçadas (D+7 e D+30):</p><div className="flex gap-2"><button onClick={()=>app.timeTravel(1)} className="flex-1 bg-white border border-slate-200 rounded-lg py-2 text-sm">+1 dia</button><button onClick={()=>app.timeTravel(7)} className="flex-1 bg-white border border-slate-200 rounded-lg py-2 text-sm">+7 dias</button><button onClick={()=>app.timeTravel(30)} className="flex-1 bg-white border border-slate-200 rounded-lg py-2 text-sm">+30 dias</button></div><button onClick={()=>{if(confirm('Zerar todo o progresso?'))app.reset();}} className="w-full mt-3 text-red-500 text-sm py-2">Reiniciar tudo</button></div>
  </div>); }

function TabBar({tab, setTab, dueCount}){ const tabs=[['home','🏠','Início'],['trilha','🗺️','Trilha'],['practice','💪','Praticar'],['profile','👤','Perfil']];
  return (<div className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 safe-b z-20"><div className="max-w-xl mx-auto flex">{tabs.map(([id,ic,label])=>(<button key={id} onClick={()=>setTab(id)} className={"flex-1 py-2.5 flex flex-col items-center gap-0.5 relative "+(tab===id?'text-teal-600':'text-slate-400')}><span className="text-xl">{ic}</span><span className="text-[11px] font-medium">{label}</span>{id==='home' && dueCount>0 && <span className="absolute top-1 right-1/4 bg-orange-500 text-white text-[10px] w-4 h-4 grid place-items-center rounded-full">{dueCount}</span>}</button>))}</div></div>); }

/* ============================ App ============================ */
function App(){ const app=useApp(); const [tab,setTab]=useState('home'); const [lesson,setLesson]=useState(null); const [celebrate,setCelebrate]=useState(false);
  if(!app.state.user.name) return <Onboarding app={app}/>;
  if(!app.state.user.diagnosticDone) return <><TopBar app={app}/><Diagnostic app={app}/></>;
  const openSkill=(id)=>setLesson({skillId:id,review:false}); const startReview=(id)=>setLesson({skillId:id,review:true});
  const closeLesson=(completed)=>{ setLesson(null); if(completed){ setCelebrate(true); setTimeout(()=>setCelebrate(false),1500);} };
  return (<div className="min-h-screen"><TopBar app={app}/>
    {lesson ? (<Lesson app={app} skillId={lesson.skillId} reviewMode={lesson.review} onDone={closeLesson}/>) : (<>
      {tab==='home' && <Home app={app} openSkill={openSkill} startReview={startReview} goTrilha={()=>setTab('trilha')} goPractice={()=>setTab('practice')}/>}
      {tab==='trilha' && <Trilha app={app} openSkill={openSkill}/>}
      {tab==='practice' && <Practice app={app}/>}
      {tab==='profile' && <Profile app={app}/>}</>)}
    {!lesson && <TabBar tab={tab} setTab={setTab} dueCount={app.dueReviews.length}/>}
    {celebrate && (<div className="fixed inset-0 z-50 grid place-items-center bg-black/30 pointer-events-none"><div className="bg-white rounded-2xl px-8 py-6 text-center pop"><div className="text-5xl">🎉</div><p className="font-bold text-slate-800 mt-2">Muito bem!</p><p className="text-sm text-slate-500">Conteúdo concluído e revisões agendadas.</p></div></div>)}
  </div>); }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- Bootstrap clássico: compila o JSX com runtime 'classic' (React.createElement, sem imports ESM) -->
<script>
(function boot(){
  if (typeof Babel === 'undefined' || typeof React === 'undefined' || typeof ReactDOM === 'undefined') { return setTimeout(boot, 40); }
  try {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#b91c1c;white-space:pre-wrap;font:13px monospace">Erro ao iniciar:\n' + (e && e.stack ? e.stack : e) + '</pre>';
    console.error(e);
  }
})();
</script>

<!-- Registra o service worker (habilita instalação como app + offline). Ignora em file:// -->
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW falhou:', e); }); });
}
</script>
